# SNMP OIDs for the MikroTik site switch and AP, the machine-readable list, kept like skill-cambium's references/snmp-oid-registry.yaml and
# skill-smc's snmp-oid-registry-tplink.yaml (operator, 2026-10-07: "the list of equipment and their OIDs and their information for MikroTik like we have
# done for Cambium"). Consumer: unified-network-controller (catalog wc-local/nautobot/catalog/vendors/mikrotik/); no code reads it yet.
#
# Rule: an OID enters a type's `oids` ONLY after a live exchange against a unit of that exact model, recorded with date, unit, site, firmware and method,
# and only when unified-network-controller has a use for it. Until then it sits in `candidates`: resolved from the vendor MIB for RouterOS 7.8 (the
# fleet's version; references/vendor-sources-20261007_1640/mib-7.8/mikrotik.mib, LAST-UPDATED 202112210000Z) with `scripts/mib_oids.py`, never typed by hand.
# SNMP ships DISABLED and the provisioning script never enables it (06_provisioning.md). With operator approval it was enabled read-only on ONE switch
# and ONE AP, amuroona, 2026-10-07 (community from KeePass cambium-devices/apn-snmp-ro, allowed from the SMC 10.255.0.1/32 only, default `public`
# disabled); `oids` holds what answered there, read from the SMC with scripts/snmp_via_smc.py. Every other unit still has SNMP off: the read path there
# is `routeros_cli` (SSH, scripts/mikrotik_exec.sh). `access` is read only unless an entry says `access: rw` (SET made and read back).
# `gps` per type records whether the device gives coordinates (operator, 2026-10-07: check every vendor's devices for GPS).
# Table OIDs listed with kind: column are COLUMN OIDs: a row reads <column>.<index>. Scalars are listed at instance .0.
# Every MIKROTIK-MIB name below has the same OID in the 7.24.5 MIB (mib-7.24.5/); POWER-ETHERNET-MIB is not supported by RouterOS (ros-snmp.txt).

schema_version: 1
updated: "2026-10-07"
arm: ".1.3.6.1.4.1.14988 (MikroTik; mikrotikExperimentalModule .1.1)"
vendor_sources: references/vendor-sources-20261007_1640/readme.md

device_types:
  rb450gx4:
    family: switch
    models: [RB450Gx4]
    equipment:
      role: "site switch, 10.255.0.5, one bridge per VLAN (01_overview.md)"
      hardware: "r2 (routerboard print, delye and amuroona 2026-10-07)"
      cpu: "IPQ-4019, 4 cores ARM 32bit, nominal 448-896 MHz auto (product-rb450gx4.txt); units run 716 MHz and warn 'cpu not running at default frequency'"
      ram: "1 GB (product page; 1024 MiB read)"
      storage: "512 MB"
      ports: "5 x gigabit copper, ether1-ether5; PoE out on ether5 only"
      power: "DC jack 10-57 V or PoE in 802.3af/at 12-57 V; max 16 W, 4 W without attachments; rct fleet 23.6-30.0 V, wh 48 V"
      temperature: "-40 to 70 C tested ambient"
      firmware: "RouterOS 7.8 (factory 6.48.7); current stable 7.24.5, long-term 7.23.7 on 2026-10-07"
      fleet: "294 of 297 rct switches surveyed 2026-10-07; also at wh sites"
    routeros_cli:
      verified: {date: "2026-10-07", units: [delye switch, amuroona switch], firmware: "7.8", method: "ssh via scripts/mikrotik_exec.sh"}
      reads:
        - "/system routerboard print (model, serial, firmware)"
        - "/system resource print (version, uptime, cpu, memory)"
        - "/system health print (voltage, temperature)"
        - "/interface ethernet print stats (link-downs)"
        - "/interface ethernet poe print"
        - "/snmp print"
    gps:
      provides_coordinates: "no"
      how: "no GPS receiver (product page); only the routeros package installed (no gps package); MIKROTIK-MIB mtxrGps .1.3.6.1.4.1.14988.1.1.12 walks empty"
      verified: {date: "2026-10-07", unit: "amuroona 450Gx4 (HEX096Y47WC)", site: amuroona, firmware: "7.8", method: "snmp walk from the SMC + /system package print"}
    oids:
      - {oid: ".1.3.6.1.2.1.1.1.0", name: sysDescr, kind: scalar, source: "MIB-2 / IF-MIB (ros-snmp.txt Used MIBs)", use: "model string", result: "'RouterOS RB450Gx4'", verified: {date: "2026-10-07", unit: "amuroona 450Gx4 (HEX096Y47WC)", site: amuroona, firmware: "7.8", method: "get/walk from the SMC, scripts/snmp_via_smc.py"}}
      - {oid: ".1.3.6.1.2.1.1.2.0", name: sysObjectID, kind: scalar, source: "MIB-2 / IF-MIB (ros-snmp.txt Used MIBs)", use: "vendor detection; the per-model value is in neither MIB, read it on the first unit", result: ".1.3.6.1.4.1.14988.1 for every model: not a model key", verified: {date: "2026-10-07", unit: "amuroona 450Gx4 (HEX096Y47WC)", site: amuroona, firmware: "7.8", method: "get/walk from the SMC, scripts/snmp_via_smc.py"}}
      - {oid: ".1.3.6.1.2.1.1.3.0", name: sysUpTime, kind: scalar, source: "MIB-2 / IF-MIB (ros-snmp.txt Used MIBs)", use: "reboot detection (TSTIK power-cycles, watchdog loops)", result: "timeticks", verified: {date: "2026-10-07", unit: "amuroona 450Gx4 (HEX096Y47WC)", site: amuroona, firmware: "7.8", method: "get/walk from the SMC, scripts/snmp_via_smc.py"}}
      - {oid: ".1.3.6.1.2.1.1.5.0", name: sysName, access: rw, kind: scalar, source: "MIB-2 / IF-MIB (ros-snmp.txt Used MIBs)", use: "identity; 450Gx4 on every switch, so not a key", result: "'450Gx4' on every switch", verified: {date: "2026-10-07", unit: "amuroona 450Gx4 (HEX096Y47WC)", site: amuroona, firmware: "7.8", method: "get/walk from the SMC, scripts/snmp_via_smc.py"}, write: "SET 450Gx4 -> 450Gx4-snmpw applied at once (CLI /system identity), restored; an SNMP GET right after a SET returns the OLD value for a few seconds, so verify a write over SSH or after a pause (amuroona 2026-10-07 19:05)"}
