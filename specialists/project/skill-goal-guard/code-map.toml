# Code map for skill-goal-guard: decisions only, read by skill-coder's helpers. Baselines are machine-written.

[meta]
summary = "skill-goal-guard's code intent: seven front ends in scripts/ over the goal_guard_lib package; Python 3.14 pinned in .mise.toml."

[scan]
roots = ["scripts", "tests"]
python = "3.14"

[write_gates]
roots = ["scripts"]
# write_gates.py reads entry points only and finds no writer here (2026-10-27): every write lives in a library module and is reached
# only through a front end's --apply (decisions_log.append, snapshot.export, restore.restore, excel.write). The one exception is
# goal_guard_hook.py --capture, which writes a redacted fixture to the runtime peer: the hook runs non-interactively, so the flag is its gate.
note = "writes are behind --apply in the front ends; hook capture is gated by --capture"

# Layers: a module imports only modules listed above it in goal_guard_lib/__init__.py; the front ends import the library, never each
# other (checked by `import_layers.py --graph`: no cycles, 2026-10-27). Dependency seams and upgrade tests are named in requirements.txt.
