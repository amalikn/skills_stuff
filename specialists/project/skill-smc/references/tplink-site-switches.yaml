# TP-Link site switches, one record per unit: identity, management addressing, VLANs, port descriptions and SNMP state. The machine-readable
# companion to 16_tplink-site-switches.md, as skill-cambium's site-addressing.yaml is to its 03_asset-register-conventions.md (operator, 2026-09-30:
# keep for TP-Link what is kept for Cambium). Provenance is structured (evidence: date, method, capture) so the file can be filtered, not just read.
# Regenerate from the captures after a new `tplink-switch.sh --backup`; never hand-edit a value the switch reports. No secret is recorded here: the
# community is named by its pattern only.

