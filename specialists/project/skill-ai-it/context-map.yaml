version: 1
# Restated as a key below so validate_navigation_control_layer.py can check it; a comment is invisible to the parser.
skill_ai_it_version: 2026-08-11-governance-checks-layer-v1

project:
  name: skill-ai-it
  type: reusable_ai_skill
  context_policy: "SKILL.md is the orchestration contract; templates/ and patterns/ are reusable content sources; CHANGELOG.md is the durable package/governance history ledger."

bootstrap:
  required_first_read:
    - AGENTS.md
    - AI_NAVIGATION.md
    - context-map.yaml
    - SKILL.md
    - CHANGELOG.md
    - ARCHITECTURE.md

authority_order:
  - path: "SKILL.md"
    type: skill_contract
    authority: highest
  - path: "CHANGELOG.md"
    type: package_history
    authority: high
  - path: "ARCHITECTURE.md"
    type: package_architecture
    authority: high
  - path: "templates"
    type: reusable_templates
    authority: high
  - path: "patterns"
    type: reusable_patterns
    authority: medium_high
  - path: "patterns/script-task-audit-checklist.md"
    type: script_task_audit_checklist
    authority: medium_high
  - path: "patterns/governance-checks.md"
    type: governance_check_doctrine
    authority: medium_high
  - path: "templates/check_governance.py"
    type: governance_checker_template
    authority: high
  - path: "AGENTS.md"
    type: agent_maintenance_rules
    authority: high
  - path: "AI_NAVIGATION.md"
    type: context_router
    authority: high
  - path: "context-map.yaml"
    type: machine_routing_map
    authority: high
  - path: "README.md"
    type: human_overview
    authority: medium
  - path: "CLAUDE.md"
    type: claude_wrapper
    authority: medium
  - path: "governance/watchman-events"
    type: filesystem_event_log
    authority: low

routing:
  skill_orchestration:
    description: "Changes to modes, phases, repeat-safety, file creation policy, or lifecycle behaviour."
    read:
      - "SKILL.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "AI_NAVIGATION.md"
      - "context-map.yaml"
      - "ARCHITECTURE.md"

  historical_context_recovery:
    description: "Reconstruct prior session history when memory backends lack detail."
    read:
      - "governance/watchman-events"
      - "SCRATCHPAD.md"
      - "CHANGELOG.md"
    rules:
      - "Check governance/watchman-events/ for filesystem timestamps when memory-keeper has no record."
      - "Use mtime evidence to identify when sessions occurred; label reconstruction with evidence basis."

  generated_templates:
    description: "Changes to project files generated by the skill."
    read:
      - "templates/**/*.md"
      - "templates/**/*.yaml"
      - "templates/**/*.json"
      - "templates/**/*.sh"
      - "templates/**/*.py"
      - "templates/justfile"
      - "patterns/governance-checks.md"   # doctrine for templates/check_governance.py; change them together
      - "SKILL.md"
      - "CHANGELOG.md"

  guidance_patterns:
    description: "Changes to optional guidance modules such as Archcore, Memory Bank, or drift audit."
    read:
      - "patterns/**/*.md"
      - "patterns/script-task-audit-checklist.md"
      - "SKILL.md"
      - "AI_NAVIGATION.md"
      - "ARCHITECTURE.md"
      - "CHANGELOG.md"
    generated_output:
      - "ARCHCORE_PROMOTION_CANDIDATES.md"   # emitted in target projects; validate candidate output when changing Archcore heuristics

  package_docs:
    description: "Changes to skill package documentation and maintenance rules."
    read:
      - "README.md"
      - "ARCHITECTURE.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "AI_NAVIGATION.md"
      - "context-map.yaml"
      - "CLAUDE.md"

  scripts:
    purpose: "Project-local scripts, automation, task runners, and executable workflows."
    read_first:
      - "justfile"
      - "scripts/README.md"
      - "patterns/script-task-audit-checklist.md"
      - "Taskfile.yml"
      - "Makefile"
      - "package.json"
    generated_support:
      - "graphify-out"
      - ".ai-context"
    rules:
      - "Respect existing canonical runner first."
      - "Prefer just --list and just <task> when a justfile exists."
      - "Read scripts/README.md before running raw scripts."
      - "Treat uncataloged scripts as unknown safety."
      - "Do not run destructive scripts without explicit review."

  automation:
    purpose: "Repeatable operational workflows and project task entrypoints."
    read_first:
      - "justfile"
      - "scripts/README.md"
      - "Taskfile.yml"
      - "Makefile"
      - "package.json"
      - "docs/automation.md"
    rules:
      - "Prefer cataloged commands."
      - "Prefer just when a justfile exists."
      - "Confirm inputs, outputs, side effects, and safety before execution."

update_rules:
  new_mode:
    update:
      - "SKILL.md"
      - "README.md"
      - "context-map.yaml"
      - "CHANGELOG.md"

  new_template:
    update:
      - "templates"
      - "SKILL.md"
      - "README.md"
      - "AI_NAVIGATION.md"
      - "context-map.yaml"
      - "CHANGELOG.md"

  new_pattern:
    update:
      - "patterns"
      - "SKILL.md"
      - "README.md"
      - "AI_NAVIGATION.md"
      - "context-map.yaml"
      - "CHANGELOG.md"

  repeat_safety_change:
    update:
      - "SKILL.md"
      - "AGENTS.md"
      - "README.md"
      - "CHANGELOG.md"

  navigation_change:
    update:
      - "AI_NAVIGATION.md"
      - "context-map.yaml"
      - "AGENTS.md"
      - "CHANGELOG.md"

  governance_history:
    update:
      - "CHANGELOG.md"

drift_policy:
  on_conflict:
    action: "stop_and_report"
    required_output:
      - conflicting_files
      - higher_authority_source
      - recommended_fix
      - assumptions

audit_checks:
  governance_file_presence:
    - "README.md"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "AI_NAVIGATION.md"
    - "context-map.yaml"
    - "CHANGELOG.md"
  version_consistency:
    description: "Verify managed block version strings match current skill version."
    action: "report_mismatch"
  companion_update_completeness:
    description: "When a governance file changes, verify all companion files in update_rules were also updated."
    action: "report_missing"
  generated_output_policy:
    description: "Verify Graphify and Repomix outputs are classified as generated support, not canonical truth."
    action: "report_violation"
  task_runner_consistency:
    description: "Verify cataloged tasks in scripts/README.md match actual script files."
    action: "report_drift"
  no_stale_references:
    description: "Detect references to removed tools, old task runners, or superseded governance assumptions."
    action: "report_stale"

promotion_rules:
  archcore:
    allowed_init_modes:
      - bootstrap
      - navigation-add
      - refresh
    content_write_modes:
      - promote
    required_authorization: true
    candidates_report: "ARCHCORE_PROMOTION_CANDIDATES.md"
    extract_heuristics_source: "patterns/archcore-routing.md"
    exclusion:
      - "CHANGELOG.md (history only)"
      - "generated files (.ai-context/, graphify-out/)"
      - "unmarked SCRATCHPAD sections"
      - "draft/obsolete roadmap items"

context_recovery:
  procedure:
    - "Read AI_NAVIGATION.md first for navigation map."
    - "Load .archcore/ context if present (durable truth)."
    - "Regenerate graphify-out/ with: graphify update ."
    - "Regenerate .ai-context/ with: repomix --config repomix.config.json"
    - "Verify SCRATCHPAD.md has current state. If empty, populate from memory-keeper / mcp-project-context."
    - "Verify CHANGELOG.md is current."
    - "Verify AI_NAVIGATION.md and context-map.yaml companion consistency."
  evidence_label: "Context recovered at <timestamp> via skill-ai-it context-recovery procedure."

answer_contract:
  require_source_paths: true
  unsupported_answer: "not found in skill package context"
  distinguish_assumptions: true
  do_not_invent_state: true
