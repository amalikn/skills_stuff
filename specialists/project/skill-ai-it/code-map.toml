# Code map: the human decisions about this project's code that skill-coder's checkers act on (created by skill-ai-it adopt_code_map 2026-11-11).
# Only decisions live here, never facts the code states (line counts, import edges, header text): the checkers measure those, and their
# shrink-only baselines are separate machine-written files. TOML so the checkers read it with the project's own Python 3.11+ (tomllib).

[meta]
summary = "Code intent for skill-ai-it: what is scanned, size limits, import layers, write gates and where each module stands."

[scan]
roots = ["scripts"]   # folders every checker scans unless its own section says otherwise
python = "3.14"              # the project's Python grammar, so newer syntax is reported rather than misread

# Size limits: warn = plan the split along a seam when next touched; the hard limit fails unless the baseline records the unit.
# The pack defaults (modules 300/400, functions 40/60; shell 100/200, 30/40) apply where nothing is set.
[limits.python]
module = 400
function = 60

[limits.shell]
module = 200
warn_module = 100

# Entry points that write without --apply, each with the gate it uses instead. A stale entry (gone, no longer writes, now gated) fails.
[write_gates]
roots = ["scripts"]
write_patterns = []   # project-specific writes, e.g. a client library's create call

[write_gates.exceptions]
# "scripts/collector.py" = "pushes metrics by design; --dry-run reads only"

[timeouts]
roots = ["scripts"]

# Timed subprocess calls whose command (ssh, scp, rsync, a shell) starts children the timeout leaves running (scripts/group_timeouts.py).
[group_timeouts]
baseline = "scripts/group-timeout-baseline.json"

# Inline linter suppressions (noqa, type: ignore, shellcheck disable, eslint-disable, nolint, allow) per file (scripts/suppressions.py).
[suppressions]
baseline = "scripts/suppressions-baseline.json"

# Where each module stands for promotion to a shared skill: project_only (reason), candidate (needs), promoted (skill = the file it moved to).
[modules."scripts/adoption/adopt_code_map.py"]
status = "promoted"
skill = "skill-ai-it/scripts/adoption/adopt_code_map.py"
reason = "skill-ai-it's own tooling: it already lives in the shared skill (decided 2026-11-11 when the map was created)"

