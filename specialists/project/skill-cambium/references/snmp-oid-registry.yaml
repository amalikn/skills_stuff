    oids:
      - {oid: ".1.3.6.1.2.1.1.6.0", name: sysLocation, access: ro, note: "SET REFUSED with the read-write community (rc 2, 'Failed object') on 5 of 5 warakurna E500 and 3 of 3 hope-vale XV2-22H: Enterprise Wi-Fi SNMP is read-only, matching the adapter's 'SNMP config unsupported' (E34). tjuntjuntjara E500s do not answer the read-only community at all (SNMP off per device, not per programme: kalumburu's E500s answer)",
         verified: {date: "2026-09-23", unit: T1_E500_IP3_10_Warakurna, site: warakurna, method: set-refused}}
      - {oid: ".1.3.6.1.2.1.1.1.0", name: sysDescr, access: ro, note: "reads 'Cambium cnPilot E500 Access Point'",
