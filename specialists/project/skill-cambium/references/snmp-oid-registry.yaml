# Verified SNMP OIDs per device type — the machine-readable registry (operator, 2026-09-22: "maintain a list of verified snmp
# oid for each device type").
#
# Rule: an OID enters a device type ONLY after a live exchange against a unit of that exact type (model), recorded with date,
# unit, site, firmware and method. Never by inference from a sibling model or a MIB mirror: cnPilotMIB matching XV2-22H is not
# proof for XV2-2T0, E500 or E430 (06_device-api-cli-reference.md). `access: rw` means a SET was made and read back on that
# type; `ro` means read only (a SET was never tried, not that it is refused). Prose, provenance and gotchas stay in
# 06_device-api-cli-reference.md; this file is the list tools read. Consumers: unified-network-controller
# `adapters/cambium/snmp.py` (reads), `wc-local/scripts/device_config/snmp_write_check.py` (write canary). Update it in the same session as
# any new live SNMP result, per this pack's Standing Write-Back Contract.
#
# Communities (vault): cambium-devices/apn-snmp-ro|rw (teleport.apn.au sites), nbn-snmp-ro|rw (teleport.communitywifi.net.au).
# apn-snmp-rw and nbn-snmp-rw both first proven 2026-09-22 (ePMP 3000L sysLocation, below).
# The community follows the unit's programme, not always the cluster: a unit moved between programmes keeps the old one (daniel-test-nbn's R195P
# and XV2-22H, behind the nbn cluster, answer only apn-snmp-ro; 2026-09-29). unified-network-controller's sweep retries silent units with the other one.
# `gps` per type (operator, 2026-10-07): "yes" own GPS fix, "configured" a position typed into the config (no receiver), "no", "unknown".
# GPS SYNC (timing) is not a position. Mirrored in unified-network-controller's catalog gps.device_types.
# Table OIDs are ENTRY OIDs: a row reads <entry>.<column>.<index>. Scalars answer at instance .0.

schema_version: 1
updated: "2026-09-28"

mib2_system: &mib2_system
  # Standard MIB-II system group. Listed per type only where verified on that type.
  sysDescr: ".1.3.6.1.2.1.1.1.0"
  sysUpTime: ".1.3.6.1.2.1.1.3.0"
  sysContact: ".1.3.6.1.2.1.1.4.0"
  sysName: ".1.3.6.1.2.1.1.5.0"
  sysLocation: ".1.3.6.1.2.1.1.6.0"

# Negative result, 2026-09-23 (kalumburu-smc01, apn-snmp-ro): LLDP-MIB `.1.0.8802.1.1.2` and the whole `.1.0.8802` arm answer `No Such Object` on ePMP 3000L, Force 300-16 (SM and
# master) and E500; the R195P returns `Error in packet`. ePMP still transmits LLDP (`networkLLDP` 1 in config_regular); see 05_known-issues.md.

device_types:
  epmp-3000l:
    family: epmp-ap
    models: [ePMP 3000L]
    arm: ".1.3.6.1.4.1.17713.21 (pmpMibTree, CAMBIUM-PMP80211-MIB)"
    gps:
      provides_coordinates: "yes"
      how: "own GPS fix: cambiumGPSStatus .1.3.6.1.4.1.17713.21.1.3 (.2 latitude, .3 longitude, .4 height, .5 time, .6 satellites tracked, .7 visible, .9 receiver); cambiumDeviceLatitude/Longitude .21.1.1.18/.19 is set at some sites only. GPS sync is separate: cambiumGPSCurrentSyncState .21.1.3.1, wirelessInterfaceSyncSource .21.3.8.2.14 (kalumburu's 3000L has a fix but runs internal free-run sync)"
      verified: {date: "2026-10-07", units: "kalumburu Tower1-Omni1, mornington MOR_T1_3000L_W_IP0_10, umoona 3000L", firmware: "ePMP 4.7.0.1 / cnWave 1.4 where read", method: "read-only SNMP from the SMC (scripts/gps_probe.py); MIB CAMBIUM-PMP80211-MIB lines 2171-2292, 283-292, 5090-5101"}
    oids:
      # Link parameters, 2026-09-28 (unified-network-controller wireless links): an AP's frequency and width, and its registered SMs.
      - {oid: ".1.3.6.1.4.1.17713.21.3.8.2.18.0", name: centerFrequency, access: ro, note: "the AP's centre frequency, MHz (5865 read); an SM's own value is its setting, not the link's",
         verified: {date: "2026-09-28", unit: JUN_3000L_T1_NW_IP0_11, site: junjuwa, firmware: "4.7.0.1", method: get}}
      - {oid: ".1.3.6.1.4.1.17713.21.3.8.2.5.0", name: wirelessInterfaceHTMode, access: ro, note: "the channel-width setting as a code (read 1); the MIB of 2013 does not name each code: 1 is taken as 20 MHz, unverified",
         verified: {date: "2026-09-28", unit: JUN_3000L_T1_NW_IP0_11, site: junjuwa, firmware: "4.7.0.1", method: get}}
      - {oid: ".1.3.6.1.4.1.17713.21.1.2.30.1.1", name: cambiumAPConnectedSTATable mac column, access: ro, note: "column 1 of the connected-STA entry: each registered SM's MAC (the AP-to-SM pairs)",
         verified: {date: "2026-09-28", unit: JUN_3000L_T1_NW_IP0_11, site: junjuwa, firmware: "4.7.0.1", method: walk}}
      - {oid: ".1.3.6.1.4.1.17713.21.1.1.31.0", name: cambiumEPMPMSN, access: ro, note: "the unit's serial (MSN); equal to the recorded serial on every junjuwa unit of this model that answered",
         verified: {date: "2026-09-28", unit: JUN_3000L_T1_NW_IP0_11, site: junjuwa, firmware: "4.7.0.1", method: get}}
      - {oid: ".1.3.6.1.2.1.1.1.0", name: sysDescr, access: ro, note: "holds the device name, not a model string",
         verified: {date: "2026-09-22", unit: MOR_T1_3000L_W_IP0_10, site: mornington, method: get}}
      - {oid: ".1.3.6.1.2.1.1.3.0", name: sysUpTime, access: ro,
         verified: {date: "2026-09-22", unit: MOR_T1_3000L_W_IP0_10, site: mornington, method: get}}
      - {oid: ".1.3.6.1.2.1.1.4.0", name: sysContact, access: ro, note: "reads 'undefined'; not written (operator)",
         verified: {date: "2026-09-22", unit: MOR_T1_3000L_W_IP0_10, site: mornington, method: get}}
      - {oid: ".1.3.6.1.2.1.1.5.0", name: sysName, access: ro, note: "holds the device name",
         verified: {date: "2026-09-22", unit: MOR_T1_3000L_W_IP0_10, site: mornington, method: get}}
      - {oid: ".1.3.6.1.2.1.1.2.0", name: sysObjectID, access: ro, note: "reads .1.3.6.1.4.1.17713.21.9.44 on two units and .21.9.43 on one, all registered as ePMP 3000L: two hardware variants under one register model",
         verified: {date: "2026-09-23", unit: "Tower1_Omni 1_IP_0_10", site: kalumburu, firmware: "4.7.0.1", method: get}}
      - {oid: ".1.3.6.1.2.1.1.6.0", name: sysLocation, access: rw,
         note: "SET, read back, restored on 6 units, 3 sites, both clusters (apn-snmp-rw and nbn-snmp-rw); sysName/sysDescr unaffected, no reboot. Test-and-revert only (operator: change nothing yet)",
         verified: {date: "2026-09-22", unit: "MOR_T1_3000L_W_IP0_10, MOR_T1_3000L_S_IP0_11, HRN_3000L_T1_Omni0_10, HRN_3000l_T1_SW0_11, HOP_3000L_T1_SecE0_21, HOP_3000L_T1_SecW0_22", site: "mornington, horn-island, hope-vale", method: set+get}}
      - {oid: ".1.3.6.1.4.1.17713.21.1.2.10.0", name: cambiumAPNumberOfConnectedSTA, access: ro,
         verified: {date: "2026-09-20", unit: HOP_3000L_T1_Omni0_20, site: hope-vale, firmware: 4.7.0.1, method: walk}}
      - oid: ".1.3.6.1.4.1.17713.21.1.2.30.1"
        name: cambiumAPConnectedSTAEntry
        access: ro
        columns: {1: mac, 2: aid, 3: channel, 4: ul_rssi, 5: dl_rssi, 6: ul_snr, 7: dl_snr, 8: ul_mcs, 9: dl_mcs, 10: ip,
                  19: tx_capacity, 20: tx_quality, 27: session_time, 28: dl_rate_mbps, 29: distance_m,
                  38: sm_model (undocumented in MIB), 43: sm_firmware (undocumented in MIB)}
        note: "live agent returns columns through .43; the MIB mirror documents 29"
        verified: {date: "2026-09-20", unit: HOP_3000L_T1_Omni0_20, site: hope-vale, firmware: 4.7.0.1, method: walk}
        # 2026-10-09 (kalumburu Tower1_Omni 1, hope-vale): column 29 distance_m reads 0 for many subscribers; 0 means not ranged, never a distance.
        # No column is an angle: 30 and 31 hold the antenna type ("Sector"). The 3000L is 2x2 MIMO on an external sector or omni antenna
        # (cambiumnetworks.com ePMP 3000L page, read 2026-10-09), so there is no angle of arrival to read; a subscriber's position from the AP is a
        # ring at the measured range, never a point. A subscriber MAC here is the unit's recorded MAC + 1 for 22 of 23 hope-vale units, and its
        # column 10 address equals the record's for all 23: two facts that identify it (unified-network-controller topology/correlate.py).
        # Range is coarse: old-looma 2026-10-09 read 149 m for 9 of 10 short links whose positions are 128-282 m apart; treat it as near or far.
    not_answering: [{unit: MOW_3000L_E_IP_0-20, site: mowanjum, date: "2026-09-22", note: "timeout on apn-snmp-ro: SNMP off or another community"}]

  xv2-22h:
    family: enterprise-wifi
    models: [XV2-22H]
    arm: ".1.3.6.1.4.1.17713.22 (cnPilotMIB)"
    gps:
      provides_coordinates: "no"
      how: "as E500: none in cnPilotMIB or the local config"
      verified: {date: "2026-10-07", units: "mornington .3.190, junjuwa .3.80", firmware: "ePMP 4.7.0.1 / cnWave 1.4 where read", method: "read-only SNMP from the SMC (scripts/gps_probe.py); MIB CAMBIUM-PMP80211-MIB lines 2171-2292, 283-292, 5090-5101"}
    oids:
      - {oid: ".1.3.6.1.2.1.1.6.0", name: sysLocation, access: ro, note: "SET refused with apn-snmp-rw (rc 2, 'Failed object') though that community reads the unit; sysName (.1.3.6.1.2.1.1.5.0) refused the same way. Config has snmp_server true, a write community and no SNMPv3 users. The E-series CAMBIUM-MIB (cambium-swap librenms/cnpilote) declares only cambiumAPSetIPAddress and cambiumAPReboot read-write; neither tested (both break connectivity). Config writes go over REST",
         verified: {date: "2026-09-29", unit: "Generic_XV2-22H_APX_IPX_X (serial W4ZA0MQ97WNS)", site: daniel-test-nbn, firmware: "6.6.0.3-r9", method: set-and-revert}}
      - {oid: ".1.3.6.1.4.1.17713.22.1.1.1.4.0", name: cambiumAPSerialNum, access: ro, note: "the AP table's serial column at instance .0, read by GET: equal to the recorded serial on every junjuwa unit of this model",
         verified: {date: "2026-09-28", unit: JUN_XV2_AP8_IP3_80, site: junjuwa, firmware: "6.6.0.3-r9", method: get}}
      - oid: ".1.3.6.1.4.1.17713.22.1.1.1"
        name: cambiumAccessPointEntry
        access: ro
        columns: {1: mac, 2: name, 3: ip, 4: serial, 5: model, 6: cpu, 7: memory, 8: sw_version, 9: uptime, 10: hardware_type,
                  11: regulatory, 12: cnmaestro_status, 13: cnmaestro_account, 14: client_count, 15: upgrade_status}
        verified: {date: "2026-09-18", unit: "HOP_XV2_AP26/27/28/29", site: hope-vale, firmware: 6.6.0.3-r9, method: walk}
      - {oid: ".1.3.6.1.4.1.17713.22.1.1.1.14", name: cambiumAPTotalClients, access: ro,
         verified: {date: "2026-09-20", unit: hope-vale XV2, site: hope-vale, firmware: 6.6.0.3-r9, method: walk}}
      - oid: ".1.3.6.1.4.1.17713.22.1.2.1"
        name: cambiumRadioEntry
        access: ro
        columns: {5: client_count, 6: channel, 7: width, 8: tx_power, 16: noise_floor, 17: interference, 18: airtime}
        verified: {date: "2026-09-20", unit: hope-vale XV2, site: hope-vale, firmware: 6.6.0.3-r9, method: walk}
      - oid: ".1.3.6.1.4.1.17713.22.1.3"
        name: cambiumClientTable
        access: ro
        columns: {2: mac, 3: ip, 4: name, 5: ssid, 6: vendor, 7: hwmode, 8: radio_index, 9: wlan, 10: vlan, 11: snr, 12: tx_rate,
                  13: counter, 14: counter, 15: counter, 16: counter}
        note: "an empty table walks as noSuchObject"
        verified: {date: "2026-09-20", unit: hope-vale XV2, site: hope-vale, firmware: 6.6.0.3-r9, method: walk}
    unverified_siblings: [XV2-2T0, E500, E430H]   # same arm expected; not proven on these models

  cnwave-v5000:
    family: cnwave-60ghz
    models: [V5000]
    arm: ".1.3.6.1.4.1.17713.60 (cnWave)"
    gps:
      provides_coordinates: "no"
      how: "no coordinate-like values in walks of .1.3.6.1.4.1 (about 1,270 values); REST getGpsBrief returns null. Per-radio gpsSync is timing only. getTopology site locations look controller-held, not checked"
      verified: {date: "2026-10-07", units: "mornington and doomadgee V5000", firmware: "ePMP 4.7.0.1 / cnWave 1.4 where read", method: "read-only SNMP from the SMC (scripts/gps_probe.py); MIB CAMBIUM-PMP80211-MIB lines 2171-2292, 283-292, 5090-5101"}
    oids:
      - {oid: ".1.3.6.1.2.1.1.1.0", name: sysDescr, access: ro, note: "e.g. 'Cambium cnWave V5000 Distribution Node, Version 1.4'",
         verified: {date: "2026-09-21", unit: MOR_T3_V5000_IP4_40, site: mornington, firmware: "1.4", method: get}}
      - oid: ".1.3.6.1.4.1.17713.60.1.1.1"
        name: cnwave link entry
        access: ro
        columns: {2: interface, 3: local_mac, 4: peer_mac, 7: signal_dbm}
        note: ".5 and .6 undocumented, deliberately unread; enabled per device (programme split)"
        verified: {date: "2026-09-21", unit: MOR_T3_V5000_IP4_40, site: mornington, firmware: "1.4", method: walk}
      - {oid: ".1.3.6.1.2.1.1.6.0", name: sysLocation, access: ro, note: "SET with the read-write community TIMES OUT (rc 1, no response) on 3 of 3 doomadgee nodes (nbn) and the one mornington node that answers reads: cnWave SNMP is read-only in practice; the read community answers the same OID",
         verified: {date: "2026-09-23", unit: DMG_T1_V5000_DN_IP4_10, site: doomadgee, firmware: "1.4", method: set-refused}}
      - {oid: ".1.3.6.1.2.1.1.1.0", name: sysDescr, access: ro, note: "V2000 and V3000 client nodes answer 'Cambium cnWave V2000/V3000 Client Node, Version 1.4' (doomadgee sweep 2026-09-23); the link entry .60.1.1.1 columns 2,3,4,7 read on V5000 DNs and a V3000 CN the same evening (link_signal metric)",
         verified: {date: "2026-09-23", unit: DMG_T5_T5-T12_IP4_12, site: doomadgee, firmware: "1.4", method: get}}
    # No serial over SNMP (2026-09-29, old-looma, firmware 1.4): a full walk of the V5000 DN LMA_T1_V5K-E_IP4_10 (12,196 values) and the V2000 CN
    # LMA_T3_V2K_IP4_12 (8,300 values) holds neither unit's serial (REST VYZF00B62FQM, VYZF0279J6VM). ENTITY-MIB (.1.3.6.1.2.1.47) is not implemented; the
    # cnWave arm .60 holds only the link entry; the rest is net-snmp (host resources, interfaces, IP). The serial is REST /local/getDeviceInfo `msn`
    # (cambium_cnwave_adapter.get_facts), read by unified-network-controller's identify and its `links` stage.
    serial_over_snmp: {available: false, verified: {date: "2026-09-29", units: [LMA_T1_V5K-E_IP4_10, LMA_T3_V2K_IP4_12], site: old-looma, firmware: "1.4", method: full walk}}
    unverified_siblings: [V1000]   # V3000 and V2000 identity read live 2026-09-23 (doomadgee); V1000 not yet

  # No verified SNMP surface yet (live walk not done): epmp-force300 (SM; SM-side scalars .17713.21.1.2.3/.18 exist on the SM, not walked here), e500, e430h, xv2-2t0.

  # Added 2026-09-23 from unified-network-controller's Kalumburu discovery test (wc-local/scripts/site_onboarding/discover_site.py): one snmpget of the
  # MIB-II identity triple per Cambium candidate from kalumburu-smc01 with apn-snmp-ro. Model-level sysObjectID is what a sweep
  # identifies a unit by before any login. Read-only: no SET was tried on these types.
  force-300-16:
    # Negative result 2026-10-09 (kalumburu, Force300_EXT1002/1004/1005/1009, apn-snmp-ro): BRIDGE-MIB dot1dTpFdb .1.3.6.1.2.1.17.4.3, Q-BRIDGE
    # dot1qTpFdb .1.3.6.1.2.1.17.7.1.2.2 and ipNetToMedia .1.3.6.1.2.1.4.22 answer No Such Object. Over REST (get_param status, EXT1020 and EXT1048)
    # cambiumSTABridgeTable lists only the unit's own MAC (camSTABrTabDevPort "Own") and cambiumArpTable only what it last spoke to. Nothing on the SM
    # records which unit is cabled to its LAN port: an R195P behind it is placed by its name's EXT number agreeing with the AP it is learnt behind.
    # Typed-in position fields (REST config, 2026-10-09): systemDeviceLocLatitude, systemDeviceLocLongitude, systemDeviceLocHeight, sysLocation and
    # snmpSystemDescription; no azimuth, tilt or heading (wirelessMUMIMOSoundingAzimuthCycle is a sounding timer). Empty at hope-vale; at low-touch
    # old-looma sysDescr (.1.3.6.1.2.1.1.1.0, = snmpSystemDescription) holds the installer's JSON record: lotno, lat, lon, confirmed, align, test,
    # variables (preferred_ssid, seqid, frequency, power, antenna_gain); 57 of 60 radios, every one confirmed, its position equal to
    # systemDeviceLoc* within 4 m. net-snmp prints it with escaped quotes.
    family: epmp-sm  # also runs as an ePMP AP / ePTP master (cambiumDeviceMode 1, cambiumSubModeType 5), same OID
    models: [Force 300-16]
    arm: ".1.3.6.1.4.1.17713.21 (pmpMibTree, CAMBIUM-PMP80211-MIB)"
    gps:
      provides_coordinates: "configured"
      how: "no receiver (cambiumGPSStatus No Such Object); a CONFIGURED position in cambiumDeviceLatitude/Longitude .21.1.1.18/.19 and systemDeviceLocLatitude/Longitude .21.3.6.1.6/.7 (read-write config), set at some units only"
      verified: {date: "2026-10-07", units: "kalumburu .0.11/.0.12 (set), mornington .21.3 (empty)", firmware: "ePMP 4.7.0.1 / cnWave 1.4 where read", method: "read-only SNMP from the SMC (scripts/gps_probe.py); MIB CAMBIUM-PMP80211-MIB lines 2171-2292, 283-292, 5090-5101"}
    oids:
      - {oid: ".1.3.6.1.4.1.17713.21.1.1.31.0", name: cambiumEPMPMSN, access: ro, note: "the unit's serial (MSN); equal to the recorded serial on every junjuwa unit of this model that answered",
         verified: {date: "2026-09-28", unit: JUN_F30016_AP9_IP3_91, site: junjuwa, firmware: "4.7.0.1", method: get}}
      - {oid: ".1.3.6.1.2.1.1.1.0", name: sysDescr, access: ro, note: "holds the device name, not a model string",
         verified: {date: "2026-09-23", unit: "Tower1_Force 300_IP_0_12_slave", site: kalumburu, firmware: "4.6.1", method: get, also: "56 units on 4.7.0.1 and 5 masters"}}
      - {oid: ".1.3.6.1.2.1.1.2.0", name: sysObjectID, access: ro, note: "reads .1.3.6.1.4.1.17713.21.9.39 on all 62 units, SM and master alike",
         verified: {date: "2026-09-23", unit: "Tower1_Force 300_IP_0_11_master", site: kalumburu, firmware: "4.7.0.1", method: get}}
      - {oid: ".1.3.6.1.2.1.1.5.0", name: sysName, access: ro, note: "holds the device name",
         verified: {date: "2026-09-23", unit: "Tower1_Force 300_IP_0_11_master", site: kalumburu, firmware: "4.7.0.1", method: get}}
      - {oid: ".1.3.6.1.4.1.17713.21.1.2.3.0", name: cambiumSTADLRSSI, access: ro, note: "SM-side downlink RSSI in dBm (-35, -45, -52 on three mornington SMs); the whole .21.1.2 SM arm answers 119 scalars on an SM",
         verified: {date: "2026-09-24", unit: MOR_F300-16SM_EXT1003_IP_21_3, site: mornington, firmware: "4.7.0.1", method: get}}
      - {oid: ".1.3.6.1.4.1.17713.21.1.2.18.0", name: cambiumSTADLSNR, access: ro, note: "SM-side downlink SNR in dB (54, 44, 36)",
         verified: {date: "2026-09-24", unit: MOR_F300-16SM_EXT1003_IP_21_3, site: mornington, firmware: "4.7.0.1", method: get}}
  e500:
    family: enterprise-wifi
    models: [E500]
    arm: ".1.3.6.1.4.1.17713.22 (cnPilotMIB)"
    gps:
      provides_coordinates: "no"
      how: "no GPS or location object in cnPilotMIB; walk of .1.3.6.1.4.1.17713.22 has no coordinate-like values"
