      - {oid: ".1.3.6.1.2.1.1.2.0", name: sysObjectID, access: ro, note: "reads .1.3.6.1.4.1.17713.22.3.5 on all four answering units",
         verified: {date: "2026-09-23", unit: Tower4_E500_AP2_IP3_20, site: kalumburu, firmware: "4.2.2.1-r3", method: get}}
      - {oid: ".1.3.6.1.2.1.1.5.0", name: sysName, access: ro,
         verified: {date: "2026-09-23", unit: Tower4_E500_AP2_IP3_20, site: kalumburu, firmware: "4.2.2.1-r3", method: get}}
  cnpilot-r195p:
    family: cnpilot-r-series
    arm: "none: sysObjectID is the bare enterprises root .1.3.6.1.4.1, so the family must come from sysDescr"
    models: [R195P]
    gps:
      provides_coordinates: "no"
      how: "CAMBIUM-MIB (enterprise 41010) has no GPS objects; indoor router. Live read not achieved (walk tooBig, one unit timed out)"
      verified: {date: "2026-10-07", units: "MIB only", firmware: "ePMP 4.7.0.1 / cnWave 1.4 where read", method: "read-only SNMP from the SMC (scripts/gps_probe.py); MIB CAMBIUM-PMP80211-MIB lines 2171-2292, 283-292, 5090-5101"}
    oids:
      - {oid: ".1.3.6.1.2.1.1.1.0", name: sysDescr, access: ro, note: "reads 'cnPilot R195P <running firmware>' (4.7-R9, 4.7.2-R10, 4.7.3-R21 seen); the family comes from it. Not the only firmware signal: see 41010 firmwareVersion below (corrected 2026-09-28)",
         verified: {date: "2026-09-23", unit: cnPilot-R195P-1103, site: kalumburu, firmware: "4.7-R9", method: get, also: "56 units answered in the final sweep; register current_firmware differed from sysDescr on 5"}}
      - {oid: ".1.3.6.1.2.1.1.2.0", name: sysObjectID, access: ro, note: "reads .1.3.6.1.4.1 (bare enterprises root); carries no model",
         verified: {date: "2026-09-23", unit: cnPilot-R195P-1103, site: kalumburu, firmware: "4.7-R9", method: get}}
      - {oid: ".1.3.6.1.2.1.1.5.0", name: sysName, access: rw, note: "holds the device name; SET with apn-snmp-rw written, read back and restored (2026-09-29)",
         verified: {date: "2026-09-29", unit: "HOR-R195P-1001 (serial WFXK0CTQRQBW)", site: daniel-test-nbn, firmware: "4.7.3-R21", method: set-and-revert,
                    also: "read first 2026-09-23 on cnPilot-R195P-1103, kalumburu, 4.7-R9"}}
      - {oid: ".1.3.6.1.2.1.1.6.0", name: sysLocation, access: rw, note: "default 'Unknown'; SET with apn-snmp-rw written, read back and restored on 3 of 3 tjuntjuntjara units (the only family besides ePMP that accepts an SNMP write). On daniel-test-nbn's unit (2026-09-29) apn-snmp-rw is refused for a GET (noAccess) yet accepted for the SET: read with the read-only community, write with the read-write one",
         verified: {date: "2026-09-24", unit: TJN-R195P-1002, site: tjuntjuntjara, firmware: "4.7.3-R21", method: set-and-revert,
                    also: "2026-09-29 HOR-R195P-1001 at daniel-test-nbn (nbn cluster, answering only the apn communities), set-and-revert ok"}}
      # CAMBIUM-MIB for cnPilot R-series (cambium-swap artifacts/mibs/librenms/cnpilotr/CAMBIUM-MIB, enterprise 41010, `status` scalars). GET the scalars:
      # a walk of .1.3.6.1.4.1.41010 answers `tooBig` on the unit. The serial is the R195P's only one (SSH reports none).
      - {oid: ".1.3.6.1.4.1.41010.1.1.1.0", name: productName, access: ro, note: "reads 'cnPilot R195P'",
         verified: {date: "2026-09-28", unit: umoona-home-2, site: umoona, firmware: "4.7.3-R21", method: get}}
      - {oid: ".1.3.6.1.4.1.41010.1.1.4.0", name: hardwareVersion, access: ro, note: "reads 'V4.5'",
         verified: {date: "2026-09-28", unit: umoona-home-2, site: umoona, firmware: "4.7.3-R21", method: get}}
      - {oid: ".1.3.6.1.4.1.41010.1.1.5.0", name: firmwareVersion, access: ro, note: "reads '4.7.3-R21(202111171123)': the release with its build stamp",
         verified: {date: "2026-09-28", unit: umoona-home-2, site: umoona, firmware: "4.7.3-R21", method: get,
                    also: "kalumburu cnPilot-R195P-1027/-1038 '4.8.1-R4(202212291041)', -1106 '4.7-R9(202006231753)'"}}
      - {oid: ".1.3.6.1.4.1.41010.1.1.6.0", name: serialNumber, access: ro, note: "reads the unit's serial ('WFXD0HBS4J73'); equal to cnMaestro's on 3 of 3 units checked",
         verified: {date: "2026-09-28", unit: umoona-home-2, site: umoona, firmware: "4.7.3-R21", method: get,
                    also: "umoona-home-3; kalumburu cnPilot-R195P-1027, -1038, -1106 (4.8.1-R4, 4.7-R9) equal to the serial Nautobot holds from cnMaestro"}}

  # Added 2026-09-28 from unified-network-controller's discovery sweeps (captures/discovery-*.json, 14 sweeps, 10 sites): the sysObjectID of two
  # types that the 2026-09-23 entries did not cover, each cross-checked against the model Nautobot already holds for the same unit (matched by MAC).
  force-300-25:
    family: epmp-sm
    models: [Force 300-25]
    arm: ".1.3.6.1.4.1.17713.21 (pmpMibTree, CAMBIUM-PMP80211-MIB)"
    gps:
      provides_coordinates: "configured"
      how: "same as Force 300-16: configured position only; umoona .1.4's is about 5 m from the site 3000L's fix, so probably copied"
      verified: {date: "2026-10-07", units: "umoona .1.4 (set), junjuwa .3.21 (empty)", firmware: "ePMP 4.7.0.1 / cnWave 1.4 where read", method: "read-only SNMP from the SMC (scripts/gps_probe.py); MIB CAMBIUM-PMP80211-MIB lines 2171-2292, 283-292, 5090-5101"}
    oids:
      - {oid: ".1.3.6.1.4.1.17713.21.1.2.1.0", name: cambiumSTAConnectedRFFrequency, access: ro, note: "the frequency the SM is connected at, MHz (5240 read): the link's frequency, unlike the SM's own centerFrequency setting (5760 on the same unit)",
         verified: {date: "2026-09-28", unit: JUN_F30025_AP2_IP3_21, site: junjuwa, firmware: "4.7.0.1", method: get}}
      - {oid: ".1.3.6.1.4.1.17713.21.1.2.2.0", name: cambiumSTAConnectedRFBandwidth, access: ro, note: "connected width code (read 1); MIB: 1 = 20 MHz, 2 = 40 MHz; other codes on current firmware unverified",
         verified: {date: "2026-09-28", unit: JUN_F30025_AP2_IP3_21, site: junjuwa, firmware: "4.7.0.1", method: get}}
      - {oid: ".1.3.6.1.4.1.17713.21.1.1.31.0", name: cambiumEPMPMSN, access: ro, note: "the unit's serial (MSN); equal to the recorded serial on every junjuwa unit of this model that answered",
         verified: {date: "2026-09-28", unit: JUN_F30025_AP2_IP3_21, site: junjuwa, firmware: "4.7.0.1", method: get}}
      - {oid: ".1.3.6.1.2.1.1.1.0", name: sysDescr, access: ro, note: "holds 'Linux <device name> <kernel>' or a config blob, never a model string: the model comes from sysObjectID only",
         verified: {date: "2026-09-28", unit: KOW_F30025_AP3_IP3_31, site: kowanyama, method: get}}
      - {oid: ".1.3.6.1.2.1.1.2.0", name: sysObjectID, access: ro, note: "reads .1.3.6.1.4.1.17713.21.9.36 on 226 swept units; all 40 that Nautobot holds are typed Force 300-25",
         verified: {date: "2026-09-28", unit: KOW_F30025_AP3_IP3_31, site: kowanyama, method: get, also: "umoona 10.255.1.4 and 10.255.1.8, OUI 00:04:56"}}
  xv2-2t0:
    family: enterprise-wifi
    models: [XV2-2T0]
    arm: ".1.3.6.1.4.1.17713.22 (cnPilotMIB)"
    gps:
      provides_coordinates: "no"
