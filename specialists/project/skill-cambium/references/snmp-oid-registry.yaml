      verified: {date: "2026-10-07", units: "mornington .3.20", firmware: "ePMP 4.7.0.1 / cnWave 1.4 where read", method: "read-only SNMP from the SMC (scripts/gps_probe.py); MIB CAMBIUM-PMP80211-MIB lines 2171-2292, 283-292, 5090-5101"}
    oids:
      - {oid: ".1.3.6.1.4.1.17713.22.1.1.1.4.0", name: cambiumAPSerialNum, access: ro, note: "the AP table's serial column at instance .0, read by GET: equal to the recorded serial on every junjuwa unit of this model",
         verified: {date: "2026-09-28", unit: JUN_XV2_AP5_IP3_50, site: junjuwa, firmware: "6.6.0.3-r9", method: get}}
      - {oid: ".1.3.6.1.2.1.1.1.0", name: sysDescr, access: ro, note: "reads 'Cambium XV2-2T0 Two Radio Dual Band Wi-Fi 6 2x2 ...': names the variant, so a sweep reads the model from here",
         verified: {date: "2026-09-28", unit: "10.255.1.3", site: umoona, method: get, also: "kowanyama 10.255.3.10"}}
      - {oid: ".1.3.6.1.2.1.1.2.0", name: sysObjectID, access: ro, note: "reads .1.3.6.1.4.1.17713.22.3.16 on 132 swept units; all 39 that Nautobot holds are typed XV2 (plain, the variant unresolved there)",
         verified: {date: "2026-09-28", unit: "10.255.1.3", site: umoona, method: get}}
