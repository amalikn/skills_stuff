# Per-site Cambium device-family IP addressing reality: register/derivation claims vs
# live-confirmed reality. Machine-readable companion to
# references/03_asset-register-conventions.md's "Per-Site IP Addressing Reality" section, which
# carries the same facts as prose.
#
# Provenance is structured and self-contained (date/devices/method as real fields, not a prose
# sentence) rather than citing an external evidence-register ID — this pack is meant to be usable
# by any project touching this hardware, not just the one whose evidence register happened to log
# the confirming session, and a structured field is what makes this file actually queryable
# (filter by date, by method, by device) instead of just readable. `notes` is free text, for a
# genuine one-off caveat that doesn't belong in a field of its own yet — if the same kind of caveat
# shows up twice, give it a real field instead of writing the same sentence shape twice.
#
# method values (extend this list before inventing a new free-text description):
#   ssh-cli-session    - authenticated SSH session, vendor CLI commands
#   ssh-rest-session    - authenticated SSH session AND an authenticated REST/HTTPS API session
#   luci-api-session    - authenticated LuCI-derived HTTPS JSON API session (ePMP family)
#   arp-mac-oui-match   - live ARP table on the site's SMC box, host's MAC OUI matched against
#                         oui_reference
#   arp-absence         - live ARP table checked, zero hosts found in the claimed range (negative
#                         evidence)
#   cnmaestro-export     - operator-supplied cnMaestro Cloud device-list export (MAC/IP/serial/
#                         firmware/status per device) — ground truth, not inferred; see
#                         cambium-swap evidence E113
#   snmp-get-session     - a real SNMPv2c GET (sysDescr/sysName) against the device, using an
#                         operator-supplied community from the KeePassXC vault (cambium-devices/
#                         apn-snmp-ro for rcp sites, cambium-devices/nbn-snmp-ro for nbn_accelerate
#                         sites — confirmed as the correct split live, not guessed)
#
# Scope: ONLY the Cambium-specific "which octet does family X live on at site Y" fact. Does NOT
# duplicate site -> smc-host -> Teleport cluster — that's resolved live from ansible-wifi by
# skill-smc's scripts/teleport-tunnel.sh, never hardcoded here or there.
#
# Only add a site/family entry once it has been checked (live ARP, an adapter session, a
# cnMaestro export, or a combination). With 20+ nbn_accelerate sites and 18+ rcp sites and only
# hope-vale (nbn_accelerate) plus nine rcp sites checked so far, this file is still far from
# complete — never add a row you haven't verified, and never guess a pattern for an unchecked site
# by analogy to a checked one. The nine checked rcp sites already disagree with each other on
# which octet each family lands on (see the per-site host_count/octet_pattern spread below) — one
# site's pattern is never a safe guess for another, even within the same smc_flavour.
#
# trust values:
#   verified     - live ARP/MAC-OUI match or a real adapter session confirmed this pattern
#   contradicted - the register or a derivation rule claims a pattern, live evidence shows a
#                  different one (or shows nothing at all, e.g. R195P)
#   unverified   - not yet checked live; do not add rows for this, it's the default absence state

schema_version: 3
updated: "2026-09-17"  # all nine rcp sites + 3 new XV2 OUI blocks + SNMP confirmations added; see git history/CHANGELOG for exact time

# Cambium MAC OUIs confirmed against real devices this fleet uses — the fastest way to identify
# a device family from a bare ARP table at a site you haven't touched yet: match the OUI, don't
# guess from IP range or hostname. Add an OUI here only once confirmed against a real device.
oui_reference:
  "bc:a9:93":
    family: enterprise-wifi-xv2
    verified:
      date: "2026-09-17"
      method: ssh-rest-session
      site: hope-vale
    notes: "NOT XV2-exclusive at every site — at Burringurrah this same OUI block is shared with cnpilot-r195p (confirmed via cnMaestro export and live SSH, cambium-swap evidence E113/E114); do not assume a bare bc:a9:93 ARP hit is XV2 without a hostname/serial cross-check"
  "58:c1:7a":
    family: epmp
    verified:
      date: "2026-09-17"
      method: luci-api-session
      site: hope-vale
    notes: "covers both ePMP AP and ePMP SM, same OUI block — ALSO not exclusive: the Enterprise Wi-Fi E-series (E500 at tjuntjuntjara, E430H at mowanjum) uses this same OUI block too (confirmed via cnMaestro export, cambium-swap evidence E116); a bare 58:c1:7a ARP hit could be ePMP or E-series, cross-check hostname/serial"
  "fc:11:65":
    family: enterprise-wifi-xv2
    verified:
      date: "2026-09-17"
      method: cnmaestro-export
      site: burringurrah
    notes: "a SECOND, separate XV2 OUI block from bc:a9:93's — Burringurrah's XV2 fleet uses this one, not bc:a9:93 (which at Burringurrah is R195P instead). Also seen at horn-island, mornington, wujal-wujal, bidyadanga. Different procurement/hardware batch than Hope Vale's bc:a9:93 units — do not assume one XV2 OUI generalises across sites"
  "b4:a2:5c":
    family: enterprise-wifi-xv2
    verified:
      date: "2026-09-17"
      method: cnmaestro-export
      site: horn-island
    notes: "a THIRD XV2 OUI block, seen alongside bc:a9:93 and fc:11:65 at horn-island/mornington/wujal-wujal — same caution as fc:11:65 above, this family has no single reliable OUI fleet-wide"
  "bc:e6:7c":
    family: enterprise-wifi-xv2
    verified:
      date: "2026-09-17"
      method: cnmaestro-export
      site: tjuntjuntjara
    notes: "a FOURTH XV2 OUI block, seen at tjuntjuntjara/mowanjum/jigalong/kalumburu (co-resident with bc:a9:93 at the latter two) — same caution as fc:11:65/b4:a2:5c above"

