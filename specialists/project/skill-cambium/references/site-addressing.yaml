          date: "2026-09-17"
          method: ssh-rest-session
          devices: [HOP_T1_V5K_IP4_100, HOP_T2_V2K_IP4_101]
        notes: "REST API (POST /local/userLogin -> JWT), not SSH CLI — the SSH TUI has no official documentation and no adapter was built for it. Role matters: HOP_T1_V5K_IP4_100 is the onboard E2E controller (POP), HOP_T2_V2K_IP4_101 is a plain Client Node — /api/getTopology and /api/getCtrlStatusDump return data only from the E2E-role node. See cambium-swap evidence E118/E119 and scripts/cambium_cnwave_adapter.py. SNMPv2c also confirmed live (method snmp-get-session, cambium-devices/nbn-snmp-ro), 10.255.4.100 — sysDescr='Cambium cnWave V5000 Distribution Node, Version 1.4'"

