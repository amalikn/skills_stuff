        octet_pattern: "10.255.0.x"
        trust: verified
        verified:
          date: "2026-09-17"
          method: luci-api-session
          devices: [HOP_3000L_T1_Omni0_20]
        notes: "SNMPv2c also confirmed live (method snmp-get-session, cambium-devices/nbn-snmp-ro), 10.255.0.20 — sysDescr shows the underlying Linux kernel string, not a Cambium-branded one"
