        notes: "SNMPv2c also confirmed live (method snmp-get-session, cambium-devices/nbn-snmp-ro), 10.255.3.1 — sysDescr='Cambium XV2-2T0 Two Radio Dual Band Wi-Fi 6 2x2 Integrated Omni Outdoor Access Point'"
