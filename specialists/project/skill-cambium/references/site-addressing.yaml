# Per-site Cambium device-family IP addressing reality: register/derivation claims vs live-confirmed reality. Machine-readable companion to
# references/03_asset-register-conventions.md's "Per-Site IP Addressing Reality" section, which carries the same facts as prose.
#
# Provenance is structured and self-contained (date/devices/method as real fields, not a prose sentence) rather than citing an external evidence-register ID —
# this pack is meant to be usable by any project touching this hardware, not just the one whose evidence register happened to log the confirming session, and a
# structured field is what makes this file actually queryable (filter by date, by method, by device) instead of just readable. `notes` is free text, for a
# genuine one-off caveat that doesn't belong in a field of its own yet — if the same kind of caveat shows up twice, give it a real field instead of writing the
# same sentence shape twice.
#
# method values (extend this list before inventing a new free-text description):
#   ssh-cli-session    - authenticated SSH session, vendor CLI commands
#   ssh-rest-session    - authenticated SSH session AND an authenticated REST/HTTPS API session
#   luci-api-session    - authenticated LuCI-derived HTTPS JSON API session (ePMP family)
#   arp-mac-oui-match   - live ARP table on the site's SMC box, host's MAC OUI matched against
#                         oui_reference
#   arp-absence         - live ARP table checked, zero hosts found in the claimed range (negative
#                         evidence)
#   cnmaestro-export     - operator-supplied cnMaestro Cloud device-list export (MAC/IP/serial/
#                         firmware/status per device) — ground truth, not inferred; see
#                         cambium-swap evidence E113
#   snmp-get-session     - a real SNMPv2c GET (sysDescr/sysName) against the device, using an
#                         operator-supplied community from the KeePassXC vault (cambium-devices/
#                         apn-snmp-ro for rcp sites, cambium-devices/nbn-snmp-ro for nbn_accelerate
#                         sites — confirmed as the correct split live, not guessed)
#
# Scope: ONLY the Cambium-specific "which octet does family X live on at site Y" fact. Does NOT duplicate site -> smc-host -> Teleport cluster — that's resolved
# live from ansible-wifi by skill-smc's scripts/teleport-tunnel.sh, never hardcoded here or there.
#
# Only add a site/family entry once it has been checked (live ARP, an adapter session, a cnMaestro export, or a combination) — never add a row you haven't
# verified, and never guess a pattern for an unchecked site by analogy to a checked one. As of 2026-09-18, every site currently known to exist in either fleet
# (27 nbn_accelerate, 9 rcp — see `sites:` and `site_short_names:` below) has a cnMaestro-export-derived families: block; further/newly onboarded sites still
# need their own entry added the same way, not inferred from a sibling site. Sites already disagree with each other on which octet each family lands on even
# within the same flavour (see the per-site host_count/octet_pattern spread below) — one site's pattern is never a safe guess for another.
#
# trust values:
#   verified     - live ARP/MAC-OUI match, a real adapter session, or a cnMaestro export confirmed
#                  this pattern
#   contradicted - the register or a derivation rule claims a pattern, live evidence shows a
#                  different one (or shows nothing at all, e.g. R195P)
#   unverified   - not yet checked live; do not add rows for this, it's the default absence state
#
# `sites:` and `site_short_names:` are both nested one level deeper than schema_version 3, under each site's flavour (`rcp` / `nbn_accelerate`) — a site's
# `flavour:` field was redundant once every site lived under its own flavour key, and KAL/other short-code collisions across flavours are exactly why the split
# matters: a short name is only unique within its own flavour, not fleet-wide (see the `site_short_names:` header comment). Regenerate a `families:` block for
# any site from its own reconciled cnMaestro-export inventory CSV with skill-cambium/scripts/generate_site_addressing_families.py — see that script's own
# docstring; it never writes this file directly, since hand-authored live-session notes below (SSH/REST/SNMP verification narrative) aren't derivable from a CSV
# and would be lost by a blind overwrite.

# 2026-09-18 update: schema restructured (sites/site_short_names nested under flavour); all 27 nbn_accelerate sites populated from the 2026-09-18 cnMaestro
# export split (evidence E124) alongside the existing 9 rcp sites; two more OUI blocks added (00:04:56, 30:cb:c7); every oui_reference entry's verified.site
# rewritten from a single dominant site + prose "also seen at" into a full site->host_count map (regenerated from device-inventory.csv, all 7 entries now use
# the identical shape — none were partially structured); 8 families: entries added to the 8 older rcp sites that had never gotten full family coverage
# (epmp-ap at burringurrah; cnwave-60ghz at horn-island/mornington/wujal-wujal; enterprise-wifi-eseries at jigalong/kalumburu/mowanjum/tjuntjuntjara), found
# by regenerating every site with scripts/generate_site_addressing_families.py and diffing against this file
