# Lint and format this project's Python with ruff (skill-coder: one linter per language, configured once at the root, for new files only).
# Adopted 2026-11-20 (skill-coder: a pack worked on without a lint config gets one); every existing Python file is excluded below.
# Files that exist when this is adopted keep their style: list each under extend-exclude, and remove one only when its reformat is decided.
# A new file is never added to the list. Never silence a rule inline (no noqa); fix it.
target-version = "py311"   # the oldest Python the project supports (its pin, requires-python)
indent-width = 2           # operator, 2026-10-23: two spaces in every language
line-length = 160
extend-exclude = [
  "*.md",                  # ruff 0.17 also formats code blocks in Markdown (languages/python.md, Learned 2026-11-11)
  "scripts/check_governance.py",
  "scripts/govcheck/__init__.py",
  "scripts/govcheck/checks/__init__.py",
  "scripts/govcheck/checks/catalog.py",
  "scripts/govcheck/checks/pack.py",
  "scripts/govcheck/checks/paths.py",
  "scripts/govcheck/checks/records.py",
  "scripts/govcheck/checks/runner.py",
  "scripts/govcheck/checks/structure.py",
  "scripts/govcheck/config.py",
  "scripts/govcheck/core.py",
  "scripts/govcheck/helpers.py",
  "scripts/pad_conventions.py",
  "scripts/pad_decisions.py",
  "scripts/pad_export.py",
  "scripts/pad_format_spec.py",
  "scripts/pad_item_check.py",
  "scripts/pad_link_opener.py",
  "scripts/pad_rewrite.py",
  "scripts/pad_toml_probe.py",
  "scripts/pad_tracker.py",
  "tests/test_pad_conventions.py",
  "tests/test_pad_decisions.py",
  "tests/test_pad_export.py",
  "tests/test_pad_format_spec.py",
  "tests/test_pad_item_check.py",
  "tests/test_pad_link_opener.py",
  "tests/test_pad_monitor.py",
  "tests/test_pad_rewrite.py",
  "tests/test_pad_toml_probe.py",
  "tests/test_pad_tracker.py",
]

[lint]
select = ["E4", "E7", "E9", "F", "B", "I"]   # the skills' common set: errors, pyflakes, bugbear, import order
