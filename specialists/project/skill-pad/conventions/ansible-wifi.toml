# ansible-wifi.toml — the apn baseline (apn-baseline.toml) adapted to the ansible-wifi Pad workspace (operator, 2026-11-19: "Baseline, adapted").
# The workspace serves three folders: the ansible-wifi clone (company Bitbucket repo), local-knowledge-ansible/ansible-wifi (operator GitHub) and
# skills_stuff specialists/project/skill-smc. ansible-wifi has no `just commit-project` or `just check`; its gates are yamllint/lint_new.sh,
# --syntax-check and the pre-push ansible-lint delta gate, and it works on several branches. writing-standard and trackers-truth keep the baseline
# text; pad-owned-trackers drops the generated tracker files this workspace does not have. 2026-11-20: contents laid out as **Rule:** and
# **Source:** (guidelines 3.3, Templates by collection); writing-standard and trackers-truth copied from the new baseline.
#
# Apply: python3 scripts/pad_conventions.py --project ansible-wifi --baseline conventions/ansible-wifi.toml --trackers "<list>" [--apply]
# Fields as in apn-baseline.toml.

[[convention]]
id = "commit-message"
replaces = "Conventional commit format"
title = "Commit messages: '<flavor or role>: <summary>', no attribution trailers"
trigger = "on-commit"
scope = "all"
priority = "should"
category = "git"
content = """**Rule:** ansible-wifi messages start with the flavor or role they touch (`rct: add haji-ali-smc01 ...`, `smc_application: ...`), then plain words: \
what changed and why, the SMC or incident that showed it. No feat:/fix: prefixes, no Co-Authored-By or "generated by" lines. A message that names \
group_vars or host_vars goes through `git commit -F <file>` (the ansible-vars guard blocks it on the command line). local-knowledge-ansible and \
skill-smc commit to their own repos with their own message style.

**Source:** ansible-wifi conventions, operator 2026-11-19 ("Baseline, adapted")."""

[[convention]]
id = "one-branch"
replaces = "Never push directly to main"
title = "Commit by pathspec on the branch the work belongs to; company repo stays clean"
trigger = "on-commit"
scope = "all"
priority = "must"
category = "git"
content = """**Rule:** ansible-wifi works on rise; iridium and master take fixes by `git cherry-pick -x` once they pass. Check `git status -sb` before a \
push: a branch already ahead with someone else's commit is pushed only with the operator's yes (push the fix alone from a temp branch off origin \
otherwise). Commit by pathspec or after checking the staged list; never `git add -A`. Never commit agent files (AGENTS.md, CLAUDE.md, .pad.toml, \
reports, plans) to ansible-wifi, ansible-noc or sidekick: they stay in .git/info/exclude and their real copies live in local-knowledge-ansible. No \
branches or PRs unless the operator asks.

**Source:** ansible-wifi conventions, operator 2026-11-19 ("Baseline, adapted")."""

[[convention]]
id = "just-check"
replaces = "Run tests before completing tasks"
title = "Lint, syntax-check and the pre-push gate pass before a task is done"
trigger = "on-task-complete"
scope = "all"
priority = "must"
category = "quality"
commands = []
content = """**Rule:** ansible-wifi: yamllint on changed files (`./lint_new.sh` for new ones), `ansible-playbook -i inventories/<flavor>/<env> <playbook> \
--syntax-check`, `ansible-inventory` parse after inventory edits, and the pre-push ansible-lint delta gate on push (every touched task: FQCN, \
capitalised name; no inline suppression). An SMC change is proven on the SMC (check mode or a read-back), never by lint alone; smc_change work \
follows roles/smc_change/AGENTS.md. skill-smc: `just check` in the pack. Fix the code, not the check. Say what was validated and what was not.

**Source:** ansible-wifi conventions, operator 2026-11-19 ("Baseline, adapted")."""

[[convention]]
id = "review-diff"
replaces = "Review your own changes before PR"
title = "Review your own diff before committing (no PRs here)"
trigger = "on-commit"
scope = "all"
priority = "should"
category = "quality"
content = """**Rule:** there are no pull requests; the review happens before the commit. Read your own `git diff` first: unintended changes, debug \
leftovers, a renamed tag or task another playbook or Jenkinsfile references, secrets or certificate paths, files another session is editing. \
Do not print group_vars or vault content to review it: use counts, `git diff --numstat`, or ansible-vars-guard read.

**Source:** ansible-wifi conventions, operator 2026-11-19 ("Baseline, adapted")."""

[[convention]]
id = "trackers-truth"
title = "Repo trackers are the truth; Pad items link to them"
trigger = "always"
scope = "all"
priority = "must"
content = """**Rule:** Pad is the operator's personal layer over {project}'s trackers ({trackers}). Never copy tracker items into Pad wholesale; a Pad \
item names the tracker ID it serves. Status changes are made in the tracker first. Exception: bugs, feature requests and tech debt live in Pad and \
their tracker files are generated from it (convention pad-owned-trackers).

**Source:** operator, 2026-11-10."""

[[convention]]
id = "writing-standard"
title = "Write plans, tasks and updates to the apn writing standard"
trigger = "always"
scope = "all"
priority = "must"
category = "documentation"
content = """**Rule:** every item tells its whole story to a reader who has not seen the chat.

**Bodies:** each section label bold at the start of its own paragraph, a blank line between sections; required labels in order, optional ones only \
when there is material. Plans: **Serves:**, **Goal:**, **Done when:**, **Out of scope:**, **Waits on:** (date in `end_date`; title: the outcome and \
its date). Tasks: **Serves:**, **Why:**, **Do:**, **Done when:** (always: tracker updated, just check passes), **Writes:** (none, repo or production; \
production needs an approval ask first), **Refs:** (title: verb and object, 70 characters or fewer). Bugs: **Seen:**, **Evidence:**, **Effect:**, \
**Closure:**, with **Cause:**, **Options:**, **Not verified:** before Closure when known; fixed only when fixed and live. Tech debt: **Serves:**, \
**Why:**, **Do:**, **Done when:**. Ideas: **Serves:**, **Why:**, **Do:**. Asks: **Question:**, then **Options:** (the recommended one marked), \
**Blocks:**, **Evidence:** when they apply. Feature requests: the operator's one line kept as written; a longer body takes **Serves:** and **Why:**. \
Decisions: generated (**Serves:**, **Decision:**), never edited in Pad. Conventions: **Rule:**, **Source:**. priority, due_date and parent are \
fields, never text.

**Links:** every item, decision or record named in a body or a comment, the status change's one-line --comment included, is a `[[REF]]` link \
(`[[DECIS-n|DL-058]]` for a decision id); every dependency is a typed relation (`pad item block`, `implements`, `split-from`, `supersedes`).

**Updates:** one when work starts, at each result and at each blocker: `pad item note` for work done, `pad item decide` for a choice, \
`pad item comment` for the rest, starting `YYYY-MM-DD HH:MM AEDT TYPE:` (FINDING, BLOCKED, RISK, CORRECTION, HANDOFF, NEXT, DONE, CLOSED) and then \
bullets (- **What:**, - **Result:**, - **Evidence:**, - **Not verified:**, - **Next:**). Complete before short; one event per comment; a correction \
is a new CORRECTION comment. The time comes from `date`, never from memory.

**Done:** before a plan, task, bug or tech-debt item moves to done, fixed, resolved, cancelled or wont-fix, add a DONE: comment (CLOSED: when not \
everything was done): what was done, the result against each done-when line, what could not be done and why, the evidence, what stays open (item \
refs). The --comment on the status change is one line that points to it. Work that produced a log attaches it (`pad attachment upload <ref> <file>`) \
and the comment names it.

**Check:** skill-pad `just item-check <ref>` exits 0 before an item is called done. Tags: only prod-write, bench, hub, skill-writeback, \
and in a workspace shared by several projects or packs a component tag on every item (guidelines 3.4).

**Source:** operator, 2026-11-18 (whole story) and 2026-11-20 (templates for every collection, links in comments); skill-pad \
docs/pad-usage-guidelines-20261110_1628.md 3.3."""

[[convention]]
id = "pad-owned-trackers"
title = "Bugs, feature requests and tech debt live in Pad"
trigger = "always"
scope = "all"
priority = "must"
category = "tracking"
content = """**Rule:** exception to trackers-truth (operator, 2026-11-10, applied to ansible-wifi 2026-11-19): bugs, feature requests and tech debt live in \
Pad, in the collections bugs (BUG-n), feature-requests (FR-n) and tech-debt (TD-n). This workspace has no generated tracker files yet; an \
incident's durable lesson still goes to skill-smc references (repo rule), and the Pad item links to that entry. A bug's first line keeps its form \
`**ID (Pn)** what is wrong`; a feature's text is the operator's own and is not reworded. Link the task that does the work with `pad item \
implements TASK-n BUG-n`.

**Source:** ansible-wifi conventions, operator 2026-11-19 ("Baseline, adapted")."""
