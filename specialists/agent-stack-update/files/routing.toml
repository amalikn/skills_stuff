version = 1
purpose = "Canonical Agent Stack routing catalogue. Personas own judgement; skills provide repeatable procedures or tools."

[routing]
default_entry = "orchestrator"
normal_persona_min = 1
normal_persona_max = 4
critic_on_material_decisions = true
prefer_narrow_skill_for_narrow_task = true
require_runtime_match_for_tool_skills = true

# Persona records intentionally describe decision ownership, not biography/style.
[[personas]]
id = "ceo-bezos"
domains = ["strategy", "business", "leadership"]
intents = ["strategy", "prioritisation", "resource-allocation", "operating-model", "executive-decision"]
owns = ["enterprise-direction", "strategic-priority", "resource-allocation"]

[[personas]]
id = "cfo-campbell"
domains = ["finance", "business", "import-economics"]
intents = ["pricing", "unit-economics", "financial-model", "capital-allocation", "cash-risk", "monetisation", "landed-cost", "import-economics", "margin", "inventory-risk", "warranty-reserve", "freight-economics", "supplier-cost-comparison", "go-no-go-economics"]
owns = ["economic-viability", "financial-guardrail", "pricing-economics"]

[[personas]]
id = "critic-munger"
domains = ["decision-quality", "risk"]
intents = ["critique", "premortem", "red-team", "assumption-review", "inversion"]
owns = ["independent-challenge"]

