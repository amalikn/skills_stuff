[[routing_rules]]
id = "research-first"
when_any = ["research", "market-research", "competitive-research", "source-validation", "evidence"]
prefer_personas = ["research-thompson"]

[[routing_rules]]
id = "economics-gate"
when_any = ["pricing", "profitability", "unit-economics", "financial-model", "capital-allocation", "business-viability"]
require_personas = ["cfo-campbell"]

[[routing_rules]]
id = "architecture-owner"
when_any = ["architecture", "technical-strategy", "migration", "scalability", "reliability"]
require_personas = ["cto-vogels"]

[[routing_rules]]
id = "implementation-owner"
when_any = ["implement", "code-change", "refactor", "application-design"]
prefer_personas = ["fullstack-dhh"]

[[routing_rules]]
id = "release-quality"
when_any = ["release", "test-strategy", "qa", "regression", "coverage"]
prefer_personas = ["qa-bach"]

[[routing_rules]]
id = "material-independent-challenge"
when_any = ["irreversible", "high-cost", "high-risk", "security-sensitive", "weak-evidence", "go-no-go"]
require_personas = ["critic-munger"]

[[routing_rules]]
id = "product-experience-chain"
when_any = ["product-change", "feature-definition", "user-flow", "ux", "ui"]
prefer_personas = ["product-norman"]
notes = "Add interaction-cooper for behavioural flow, ui-duarte for visual treatment, and fullstack-dhh only when implementation is in scope."

[[routing_rules]]
id = "network-technical-owner"
when_any = ["network-design", "routing", "switching", "bgp", "ospf", "pppoe", "radius", "dns", "network-troubleshooting", "capacity-planning", "network-migration", "vendor-platform"]
require_personas = ["cto-vogels"]
notes = "Add DevOps only for operational delivery/automation/observability; add QA only for validation/release confidence."

[[routing_rules]]
id = "import-evidence-first"
when_any = ["import-business", "supplier-selection", "auction-sourcing", "customs", "tariff", "import-regulation", "vehicle-eligibility", "market-pricing", "demand-research"]
require_personas = ["research-thompson"]
notes = "Regulatory/legal-adjacent questions remain evidence/research tasks; do not imply legal advice persona capability."

[[routing_rules]]
id = "import-economics-gate"
when_any = ["landed-cost", "import-economics", "margin", "inventory-risk", "warranty-reserve", "freight-economics", "go-no-go-economics"]
require_personas = ["cfo-campbell"]

[[routing_rules]]
id = "import-operations-owner"
when_any = ["import-workflow", "sourcing", "inspection", "freight", "customs-process", "inventory-process", "fulfilment", "auction-sourcing", "pilot"]
prefer_personas = ["operations-pg"]

[[routing_rules]]
id = "current-facts-research"
when_any = ["current-facts", "current-price", "current-regulation", "current-availability", "vendor-documentation"]
require_personas = ["research-thompson"]

[[personas]]
id = "orchestrator-follett"
domains = ["coordination", "routing"]
intents = ["orchestration", "multi-domain", "team-selection", "skill-selection", "synthesis"]
owns = ["routing", "coordination", "synthesis"]
