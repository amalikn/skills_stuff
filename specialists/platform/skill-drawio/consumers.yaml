# Every project whose drawing skill-drawio's render_flowmap.py generates: what scripts/consumer_check.py renders to prove an engine change.
# Found 2026-10-29 by the banner "GENERATED by skill-drawio scripts/render_flowmap.py" in .drawio files under /Volumes/Data. Add a project
# when it adopts the engine. root: the folder render_flowmap runs from (its --root); map and schema relative to it; schema "" for the skill's.
consumers:
  - name: unc
    root: /Volumes/Data/_ai/_project/project_stuff/apn/unified-network-controller
    map: docs/flows/flows.yaml
    schema: docs/flows/flows.schema.json
  - name: smc-resiliency
    root: /Volumes/Data/_ai/_project/project_stuff/apn/smc-resiliency
    map: docs/flows/flows.yaml
    schema: docs/flows/flows.schema.json
  - name: smc-change
    root: /Volumes/Data/_ansible/local-knowledge-ansible/ansible-wifi/roles/smc_change
    map: drawio/flows.yaml
    schema: ""
  - name: goal-guard
    root: /Volumes/Data/_ai/_skills/skills_stuff/specialists/project/skill-goal-guard/docs/goal-guard-flows
    map: goal_guard_flows.yaml
    schema: ""
  - name: example-shop
    root: examples/shop
    map: flows.yaml
    schema: ""
