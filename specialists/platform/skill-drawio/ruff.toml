# Lint and format this pack's Python with ruff (skill-coder: one linter per language, configured once at the root, for new files only).
# Added 2026-11-16 (operator: every project and skill gets a lint config when worked on, if it has none). Run: just lint (part of just check).
# Files that existed when this was adopted keep their style (four spaces): each is listed under extend-exclude and leaves the list only when
# its reformat is decided. A new file is never added to the list. Never silence a rule inline (no noqa); fix it.
target-version = "py311"   # the pack's oldest supported Python (justfile test-matrix)
indent-width = 2           # operator, 2026-10-23: two spaces in every language
line-length = 160
force-exclude = true       # a hook or editor passing an excluded file by name does not reformat it
