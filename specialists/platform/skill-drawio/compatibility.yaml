# Environments this skill was verified against: product, version, components and when observed.
# Untested: draw.io desktop on Windows and Linux, desktop versions other than 32.4.1 and 32.5.5, the web app (app.diagrams.net) and the VS Code extension.
# They are expected to read and write the same file format, but no export flag or rendering behaviour here was exercised on them.
environments:
  - id: drawio-desktop-32-5-5
    product: draw.io desktop (macOS)
    product_version: 32.5.5
    components: [CLI export, PNG, XML, page selection, layer selection, scale, installed app bundle]
    observed_at: "2026-10-19"
    evidence_locator: >-
      `draw.io --help` captured as documents/drawio-sources-20261019/drawio-desktop-cli-help-32.5.5.txt; scratch two-page, two-layer file exported with -x -f png
      (no -p, -p 2, -p 1 --layers 0, -s 2) and -x -f xml, outputs checked by pixel size and by eye; a 3.5 s single-page export through a Python subprocess with
      --disable-update and a timeout; app.asar searched for the data:page/id, link form
    validation_layer: observed_install
    result: pass
  - id: drawio-desktop-32-4-1
    product: draw.io desktop (macOS)
    product_version: 32.4.1
    components: [CLI export, PNG, page selection, layer selection, static edge rendering, line hops]
    observed_at: "2026-10-19"
    evidence_locator: >-
      UNC docs/flows/readme.md 'Exporting and checking the drawing' and /Volumes/Data/_ai/claude-auto-memory/reference_drawio_cli.md: -p 1-based, --layers 0,1,
      layer cells after the root, jumpSize is the hop width, orthogonal edges without waypoints drawn through boxes; recorded by the project, not re-run here
      (the installed app had updated to 32.5.5 by the time this pack was written)
