version = 2
description = "Representative routing regression corpus for Agent Stack real-world workloads. Behavioral scoring is implemented by scripts/evaluate_routing.py."

# ==============================================================================================================================================================
# WHAT THIS FILE IS
#
# 60 cases describing how Agent Stack SHOULD route real workloads. Each case gives a model a task and asserts what a correct route looks like.
# `scripts/evaluate_routing.py` scores a model's returned plan against those assertions.
#
# Two ways to run it:
#   just routing-eval-check       validates this corpus against routing.toml — no model call, belongs in preflight
#   just routing-eval-hermes 60   behavioural run against a real model
#
# ==============================================================================================================================================================
# FIELD SEMANTICS — the required / preferred / forbidden split is the whole scoring model
#
#   required_personas    HARD. Absent from the plan => -20 and the case fails.
#   required_skills      HARD, same.
#   forbidden_personas   HARD. Present in the plan => -20 and the case fails. This is how a case says "this domain looks adjacent but is not
#   forbidden_skills       relevant" — e.g. a networking case forbids cfo-campbell.
#   preferred_personas   SOFT. Missing one lowers the diagnostic score but does NOT fail the case. Use for a route that is better but not the
#   preferred_skills       only defensible one.
#   primary_owner        HARD when set. The single persona accountable for the answer. null on direct-skill cases.
#   max_personas         HARD ceiling. Exceeding it scores "team inflation".
#
# Only HARD failures decide pass/fail. Preferred matches move the number, not the verdict — so a case can score 90 and still fail, and reading the pass rate
# without the failure classes will mislead you.
#
# DIRECT-SKILL CASES: `primary_owner = null` + `max_personas = 1` + empty required_personas means the task should be answered by a skill alone. Selecting ANY
# persona fails it. These exist to catch team inflation and live mostly in the direct-adversarial family; treat that family as the canary for over-routing.
#
# ==============================================================================================================================================================
# THE FOUR GATE FLAGS
#
# Each case declares which obligations a correct route carries. Their meanings are defined in routing.toml's [[gates]] section, which the evaluation prompt
# supplies to the model in full — keep the two in step.
#
#   research_required   Further EXTERNAL evidence must be acquired. False when the evidence needed is already in the task or in the artefact under
#                       review — it does not stay true merely because facts are involved.
#   critic_required     The route reaches a consequential or hard-to-reverse conclusion. Consequence is the trigger, not complexity and not disagreement.
#   qa_required         Code, config or a release is created, changed, or judged fit to ship. A design-only task trips this only if it commits to a
#                       rollout/validation mechanism.
#   runtime_required    COMPUTED, never judged. True iff a selected skill declares execution = "tool" in routing.toml. The scorer calculates this and
#                       ignores the model's self-report; a mismatch is recorded as a diagnostic about prompt-following, not as a routing error.
#
# A gate is an obligation on the ROUTE, not an instruction to add a persona. The scorer accepts either a capability skill or the gate's persona as satisfaction
# — requiring the persona would cause the very inflation the direct-skill cases exist to punish.
#
# RESOLVED 2026-09-01. This section previously recorded a conflict: routing.toml marked critic-gate as requiring its persona unconditionally, while this corpus
# lists critic-munger as *preferred* in 19 of the 22 critic_required cases and *required* in only 1. It was resolved in the CATALOGUE's favour of capability
# satisfaction — no gate now requires its persona unconditionally; each escalates only on its own persona_mandatory_when_tags. The scorer still does not enforce
# persona escalation, because the corpus carries no tags for it to test against. Nothing here needs changing.
#
# ==============================================================================================================================================================
# ==============================================================================================================================================================
# THIS 60-CASE CORPUS IS FROZEN AS A DEVELOPMENT SET — 2026-09-02
#
# It has done its job. It took routing from a specification failure (43 gate misses against undefined flags) through an ownership-precedence phase to a measured
# architecture, and it is the corpus that proved deterministic closure worth +25 to +40 points on three different models. With closure applied it now scores
# 50/60, and production-tier models reach ~80% live.
#
# DO NOT TUNE AGAINST IT FURTHER. Past this point a better score on these 60 stops being evidence of better routing and starts being evidence of fitting the
# corpus — the failures that remain are no longer dominated by one architectural defect, which is precisely the condition under which further optimisation
# overfits. Add cases only to cover a NEW routing concept, never to chase a number.
#
# The next evidence must come from outside this file: an unseen holdout authored without reference to these cases, and replay against real project tasks.
# ==============================================================================================================================================================

# `required_personas` IS FOR MANDATORY OWNERSHIP, NOT AN IDEAL TEAM (policy set 2026-09-02)
#
#   required_personas  = ownership or independent judgement that is genuinely mandatory for THIS case
#   preferred_personas = who would improve the route without being required
#   tags               = semantic characteristics of the task; they say WHY a generic policy applies. Judged by the model, never derived from the two above
#   capability         = enough for ordinary fulfilment — a gate is discharged by any provider declaring it at primary strength
#
# Do not use `required_personas` to force a complete team. Three cases were relaxed under this rule: net-security-review keeps cto-vogels because the
# deliverable IS security posture, but drops qa-bach because the case already requires security-audit, which provides validation at primary strength;
# python-feature is ordinary implementation against settled criteria, so a validation capability suffices; jdm-portal-build keeps product-norman because
# "define and build" means requirements are still open, and drops the rest of its four-persona team to preferred.
# IS security posture, but drops qa-bach because the case already requires security-audit, which provides validation at primary strength; python-feature is
# ordinary implementation against settled criteria, so a validation capability suffices; jdm-portal-build keeps product-norman because "define and build" means
# requirements are still open, and drops the rest of its four-persona team to preferred.
#
# ==============================================================================================================================================================
# ADDING A CASE
#
# 1. Give it a stable `id`, a real `task` (one sentence, no hints about the expected route), a `mode`, and a `family`.
# 2. Assert only what you would genuinely defend as wrong-if-absent. Over-using `required_*` makes the corpus brittle and turns legitimate alternative routes
#    into failures.
# 3. Add at least one `forbidden_*` where an adjacent-looking domain should NOT be pulled in — those catch more real defects than the positive assertions do.
# 4. Set all four gate flags deliberately. Every case asserts all four, so an unconsidered `false` is still a claim.
# 5. Run `just routing-eval-check` — it verifies every persona/skill id resolves against routing.toml before any model is invoked.
#
# Editing this file changes `eval_corpus_sha` in result provenance, which is how a stale comparison is detected. That is intended: results from different corpus
# versions are not comparable. Comments do not change parsed data, so a comment-only edit is safe mid-run, but it does move the hash.
# ==============================================================================================================================================================


# --------------------------------------------------------------------------------------------------------------------------------------------------------------
# NETWORKING / INFRASTRUCTURE  (15 cases)
#
#   ISP-scale network and Linux infrastructure work: diagnosis, design, migration, automation, observability, security.
#
#   Owner is normally cto-vogels; devops-hightower joins for operational delivery, qa-bach for validation. Carries the
#   most gate assertions of any family and, in the 2026-09-01 baseline, the most genuine routing errors — the
#   cto-vogels / fullstack-dhh boundary is the recurring confusion.
# --------------------------------------------------------------------------------------------------------------------------------------------------------------

