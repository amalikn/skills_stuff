task = "Customs has questioned the declared value on our last two shipments, citing our relationship with the supplier. Establish how related-party valuation is actually assessed for imports of this kind, what evidence is normally accepted to support a declared price, and what documentation would settle this without a formal dispute."
primary_owner = "research-thompson"
required_skills = ["deep-research"]
max_personas = 2
