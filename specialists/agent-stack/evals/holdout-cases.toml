# External market facts that move, gathered to set our own price. Research owns; no commitment is being made in this task, so no critic.
[[cases]]
id = "hbiz-contract-rate-benchmark"
family = "business-research"
mode = "research"
task = "What are current day rates in Australia for contract network automation engineers, split by seniority, and how have they moved over the last eighteen months? Distinguish advertised rates from rates actually transacted where the evidence allows. We will use this to set our own."
primary_owner = "research-thompson"
required_skills = ["deep-research"]
max_personas = 2
research_required = true
critic_required = false
qa_required = false
runtime_required = true

# Irreversible in the way that matters: customers are told, staff are reassigned, and the line cannot be restarted cheaply. Both `high-consequence` and
# `irreversible` sit in the critic gate's persona_mandatory_when_tags, so the critic PERSONA is required here rather than merely the capability — the one case in
# this holdout where independence of judgement is itself part of the deliverable.
[[cases]]
id = "hbiz-service-line-exit"
family = "business-research"
mode = "decision"
task = "Our managed-WiFi service line is fourteen per cent of revenue and consumes about forty per cent of support hours. Decide whether we exit it. If we do, work out what we owe existing customers through a wind-down and how long that obligation runs. Three of the six customers are on multi-year agreements."
primary_owner = "ceo-bezos"
required_personas = ["ceo-bezos", "critic-munger"]
preferred_personas = ["cfo-campbell"]
max_personas = 4
research_required = false
critic_required = true
qa_required = false
runtime_required = false

# Commercial mechanism design. Anti-gaming is a design property here, not an independent-challenge obligation.
[[cases]]
id = "hbiz-referral-terms"
family = "business-research"
mode = "design"
task = "Design the referral arrangement we offer two integrator partners: what event triggers a fee, how the referral is attributed and measured, when it is paid, and what stops the arrangement being gamed by a partner registering leads we already had."
primary_owner = "sales-ross"
preferred_personas = ["cfo-campbell"]
max_personas = 2
research_required = false
critic_required = false
qa_required = false
runtime_required = false

