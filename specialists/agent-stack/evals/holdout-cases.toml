# Current regulation held entirely outside the business, and the research gate's persona_mandatory_when_tags includes `regulatory`, so Research owning it is the
# contract's own answer rather than a preference.
[[cases]]
id = "hjdm-compliance-pathway"
family = "jdm-import"
mode = "research"
task = "For a 1999 Nissan Stagea brought in under the twenty-five-year rule, establish the current Australian requirements end to end: which approval pathway applies, what the asbestos declaration demands and who can sign it, and which modifications are mandatory before it can be registered in Victoria. We need what is in force now, not what applied when we last imported."
primary_owner = "research-thompson"
required_skills = ["deep-research"]
max_personas = 2
research_required = true
critic_required = false
qa_required = false
runtime_required = true

# Operating mechanism design against a known throughput. Nothing external, nothing irreversible, nothing to validate.
[[cases]]
id = "hjdm-workshop-flow"
family = "jdm-import"
mode = "design"
task = "Design the workshop flow for compliance work at eight cars a month: bay allocation, the parts lead-time buffer that keeps a car from occupying a bay while it waits, and how a car that fails inspection re-enters the queue without blocking the line behind it. We have three bays and two technicians."
primary_owner = "operations-pg"
max_personas = 2
research_required = false
critic_required = false
qa_required = false
runtime_required = false

# A financial verdict on a twelve-month commitment with a standing empty-slot exposure. research-vs-economics puts the verdict with the CFO. The commitment is
# what makes independent challenge an obligation rather than a courtesy; the provider is left to the route.
[[cases]]
id = "hjdm-freight-commitment"
family = "jdm-import"
mode = "decision"
task = "We can keep booking RoRo per car or commit to a shared forty-foot container every six weeks. The container is materially cheaper per unit but we pay for empty slots when volume dips, and the booking is a twelve-month commitment. Our last eighteen months of booking and volume history is attached. Which do we commit to?"
primary_owner = "cfo-campbell"
required_skills = ["financial-unit-economics"]
preferred_skills = ["premortem"]
max_personas = 3
research_required = false
critic_required = true
qa_required = false
runtime_required = false

# Model-building against an internal calibration set. Deliberately NOT asserting qa: the task asks for the model, and calibration is part of building it, not a
# separate validation deliverable. This case is one of the ones most likely to draw an unnecessary QA gate.
[[cases]]
id = "hjdm-auction-grade-model"
family = "jdm-import"
mode = "implementation"
task = "Build the scoring model that turns Japanese auction sheet grades and the inspector's free-text notes into our own condition score. Calibrate it against the three hundred cars we have already landed, where we know what each actually needed once it arrived."
primary_owner = "fullstack-dhh"
max_personas = 2
research_required = false
critic_required = false
qa_required = false
runtime_required = false

# DELIBERATELY AMBIGUOUS OWNERSHIP. Channel design, margin sustainability and a three-month learning test all sit in one ask; Sales, CFO and Operations each own
# part of it. Recorded expectation is Sales, because the deliverable is a repeatable channel offer and the margin and the test are attributes of that offer. If
# this case fails, read it as a boundary question rather than a router defect, and resolve it in the precedence table or not at all.
[[cases]]
id = "hjdm-workshop-channel"
family = "jdm-import"
mode = "mixed"
task = "We want to sell through two performance workshops rather than direct to consumer. Define what the offer to a workshop actually is, the margin split we can sustain given our current landed costs, and how we would know within three months whether to continue or pull it."
primary_owner = "sales-ross"
preferred_personas = ["cfo-campbell", "operations-pg"]
max_personas = 3
research_required = false
critic_required = false
qa_required = false
runtime_required = false

