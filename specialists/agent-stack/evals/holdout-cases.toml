# direct-adversarial — 3
# =============================================================================================================================================================

# One narrow procedural skill, one screen, no decision. Anything beyond the skill is inflation.
[[cases]]
id = "hdirect-order-tracking-audit"
family = "direct-adversarial"
mode = "review"
task = "Run a usability audit of the order-tracking screen in our customer portal and list the concrete problems a customer hits, in the order they hit them."
required_skills = ["ux-audit-rethink"]
max_personas = 1
research_required = false
critic_required = false
qa_required = false
runtime_required = false

# Research IS required — the facts are external and current — but the narrowest provider declares research at primary strength and is analysis-class, so the
# gate closes with no persona and no runtime. This case exists to separate "the gate is true" from "therefore add the researcher and a tool".
[[cases]]
id = "hdirect-competitor-pricing-scan"
family = "direct-adversarial"
mode = "research"
task = "Give me a current picture of what three named competitors are charging and claiming on their public pricing pages, side by side with ours. Public pages only — I am not asking anyone to infer their discounting."
required_skills = ["competitive-intelligence-analyst"]
max_personas = 1
research_required = true
critic_required = false
qa_required = false
runtime_required = false

# Independence of judgement IS the deliverable, so the critic gate is genuinely true — but a skill declaring independent-challenge at primary strength discharges
# it, and nothing here is being committed to. A route that adds a persona is not wrong on the gate; it is wrong on the size of the answer.
[[cases]]
id = "hdirect-vendor-claim-teardown"
family = "direct-adversarial"
mode = "review"
task = "A vendor claims their SD-WAN will cut our WAN spend by forty per cent. Tear the claim apart: where can that number have come from, what would have to be true of our traffic and contracts for it to hold, and which parts are unfalsifiable as stated."
required_skills = ["scientific-critical-thinking"]
max_personas = 2
research_required = false
critic_required = true
qa_required = false
runtime_required = false
