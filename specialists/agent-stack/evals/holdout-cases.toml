version = 1
description = """
UNSEEN HOLDOUT — 24 cases, authored 20260902 without opening evals/routing-cases.toml.

WHAT THIS IS. Independent evidence about routing quality. The development 60 are frozen because a better score on them is evidence of fitting the corpus; these
24 were written blind to that corpus to escape exactly that. The only thing read from the frozen file during authoring was its SCHEMA — the key names, the six
`mode` values and the observed `max_personas` range — printed by a script that displayed no task, no id and no route expectation.

HOW IT WAS AUTHORED. Task text first, in full, describing work that would plausibly arrive from this operator. Ownership, gates and capabilities were assigned
afterwards, from the task as written. No case was constructed backwards from a route worth testing, and gate coverage was NOT balanced deliberately — 13 of the
24 assert no gate at all, which is what the tasks produced rather than a target.

SINGLE USE. These are spent the moment they are executed. Tuning anything against their failures converts them into development cases and destroys the property
that makes them worth running. If a case is later found to be wrong ON ITS OWN TERMS — self-contradictory, or asserting something the catalogue cannot express —
retire it explicitly and record why; do not quietly re-tune it into agreement with the router.

SELF-CONSISTENCY RULE APPLIED THROUGHOUT. `runtime_required` is computed from the selected skills, so a case asserts it only where it also REQUIRES a tool-class
skill (spec 0005). The converse now matters too: since 2026-09-02 a route is penalised for over-asserting a gate, so a case must not assert `runtime_required =
false` while expecting a route whose natural provider is tool-class. Every case below was checked in both directions.
"""

# =============================================================================================================================================================
# networking-infrastructure — 5
# =============================================================================================================================================================

# Narrow operational diagnosis against evidence already in hand. No gate should fire: nothing external is being established, nothing is being committed, and no
# artefact is being validated. A route that adds a critic or a researcher here is over-routing.
[[cases]]
id = "hnet-wifi-roaming"
family = "networking-infrastructure"
mode = "review"
task = "Clients on our campus WiFi hold onto distant APs instead of roaming. 802.11r is enabled on all SSIDs but handoffs still take three to five seconds, and voice calls drop during them. We have four weeks of controller logs, the original site survey, and per-client RSSI histories. Work out what is causing the sticky-client behaviour and what to change."
primary_owner = "cto-vogels"
max_personas = 2
research_required = false
critic_required = false
qa_required = false
runtime_required = false

# Architecture design with a hard cutover constraint. Expensive and painful to reverse once hardware is ordered and addressing is committed, so independent
# challenge is a genuine obligation. The PROVIDER is deliberately left to the route: premortem is only preferred, so the case tests whether the model closes the
# gate at all rather than whether it picks the same closer we would.
[[cases]]
id = "hnet-fabric-refresh"
family = "networking-infrastructure"
mode = "design"
task = "Design the replacement leaf-spine fabric for our two datacentre halls: EVPN-VXLAN, dual-homed hosts, and a migration path off the existing MLAG pairs. No single maintenance window may exceed thirty minutes, and we cannot take both halls down in the same night. Hardware is ordered against whatever this design says."
primary_owner = "cto-vogels"
preferred_personas = ["devops-hightower"]
preferred_skills = ["premortem"]
max_personas = 3
research_required = false
critic_required = true
qa_required = false
runtime_required = false

# External current facts held by third parties, where the vendors' own claims are the thing in doubt. Research is the deliverable, so Research owns it and the
# network specialist advises. deep-research is tool-class, so runtime is asserted and earned.
[[cases]]
id = "hnet-carrier-diversity"
family = "networking-infrastructure"
mode = "research"
task = "Both of our upstream transit providers advertise diverse paths, but we suspect they terminate in the same building and may share conduit. Establish from current public route and facility information, plus the carriers' own published documentation, whether the diversity we are paying for is real, and tell us what our actual exposure is."
primary_owner = "research-thompson"
required_skills = ["deep-research"]
preferred_personas = ["cto-vogels"]
max_personas = 3
research_required = true
critic_required = false
qa_required = false
runtime_required = true

# Post-incident analysis, evidence supplied. Operability and corrective action are the deliverable, which is DevOps rather than architecture. No gate: the
# outage already happened, nothing is being decided or released, and every input is in hand.
[[cases]]
id = "hnet-radius-postmortem"
family = "networking-infrastructure"
mode = "review"
task = "RADIUS authentication failed for forty minutes across three sites last night. We have the syslog bundle from both servers, the configuration diff applied that afternoon, the vendor release notes for the version we are on, and the switch logs from one affected site. Produce the post-incident analysis and the corrective actions."
primary_owner = "devops-hightower"
preferred_personas = ["cto-vogels"]
max_personas = 2
research_required = false
critic_required = false
qa_required = false
runtime_required = false

# Implementation whose deliverable EXPLICITLY includes proving equivalence. Validation is not a nicety here, it is half the ask, so the QA gate is asserted and
# its tool-class provider is required — which earns runtime. Ownership follows artefact-vs-domain-review: this is code with a firewall context, not a security
# posture review, so Full-Stack owns it.
[[cases]]
id = "hnet-firewall-consolidation"
family = "networking-infrastructure"
mode = "implementation"
task = "Consolidate roughly 1,400 legacy firewall rules into a policy set for the new platform. Produce the rule-generation script and the equivalence checks that demonstrate the new set admits and denies exactly what the old one did, including the shadowed rules we expect to find."
primary_owner = "fullstack-dhh"
required_skills = ["senior-qa"]
max_personas = 3
research_required = false
critic_required = false
qa_required = true
runtime_required = true

# =============================================================================================================================================================
# software-ai-engineering — 4
# =============================================================================================================================================================

# Deliberately narrow. The task states that behaviour is already covered by tests, which removes the validation obligation rather than merely making it
# inconvenient. A route that asserts qa here is reading the domain, not the task.
[[cases]]
id = "hsw-parser-refactor"
family = "software-ai-engineering"
mode = "implementation"
task = "Our log parser has grown three near-identical branches, one per appliance firmware version, and they have started to drift. Refactor it into one parser with a version adapter. The existing test suite already asserts the output format for all three versions and must keep passing unchanged."
primary_owner = "fullstack-dhh"
max_personas = 1
research_required = false
critic_required = false
qa_required = false
runtime_required = false

# Design of tooling, not of the orchestrator itself, so component-cannot-architect-itself does not apply and the CTO owns it straightforwardly. Reversible and
# internal: no gate.
[[cases]]
id = "hsw-token-budget-design"
family = "software-ai-engineering"
mode = "design"
task = "Design how our MCP tooling should stay inside a token budget: which call results get summarised in the sandbox before returning, which return raw, how the caller learns that something was truncated, and what the caller can do about it. We control both ends."
primary_owner = "cto-vogels"
max_personas = 2
research_required = false
critic_required = false
qa_required = false
runtime_required = false

# Security POSTURE as the deliverable, which artefact-vs-domain-review puts with the CTO even though the artefact under review is code. The QA gate is NOT
# asserted: nothing is being released or validated, the ask is an assessment. security-audit declares security-review and validation at primary strength and is
# analysis-class, so no runtime.
[[cases]]
id = "hsw-auth-secrets-review"
family = "software-ai-engineering"
mode = "review"
task = "Review the authentication and secrets handling in our internal portal: token lifetimes and refresh, where credentials sit at rest, what the service account can reach, and what an attacker with read access to the repository could obtain. Tell us what is actually exposed, not a checklist."
primary_owner = "cto-vogels"
required_skills = ["security-audit"]
max_personas = 2
research_required = false
critic_required = false
qa_required = false
runtime_required = false

# A technology selection resting on current external product behaviour that changes release to release. Research is required and earned through a tool-class
# provider. The verdict is technical rather than financial, so the CTO owns and Research advises — the mirror of hnet-carrier-diversity, where the evidence was
# the deliverable.
[[cases]]
id = "hsw-vector-store-choice"
family = "software-ai-engineering"
mode = "decision"
task = "Choose the vector store for our retrieval layer. The shortlist is Qdrant, pgvector and LanceDB. We need current limits on filtered search, hybrid retrieval and the operational footprint of each, then a recommendation we will live with for at least a year. Our corpus is about two million chunks with heavy metadata filtering."
primary_owner = "cto-vogels"
required_skills = ["deep-research"]
preferred_personas = ["research-thompson"]
max_personas = 3
research_required = true
critic_required = false
qa_required = false
runtime_required = true

