[[capabilities]]
id = "source-validation"
description = "Corroborate, triangulate and authenticate sources."

[[capabilities]]
id = "release-readiness"
description = "Rollout, rollback, acceptance, ship / no-ship."

[[capabilities]]
id = "migration-planning"
description = "Staged technical transition."

[[capabilities]]
id = "network-analysis"
description = "Routing, switching, protocol and network behaviour."

# --------------------------------------------------------------------------------------------------------------------------------------------------------------
# GATE CLASSES
#
# A gate is an OBLIGATION ON THE ROUTE, not an instruction to add a persona. "This task needs research evidence" and "this task needs an independent Research
# persona" are different claims: a CTO checking vendor documentation with a research skill satisfies the first without the second. Personas become mandatory
# only where INDEPENDENCE of judgement is the point. Keeping these separate is what stops gates causing persona inflation, which the direct-adversarial eval
# family exists to catch.
#
# Division of labour, so the model is not asked to self-report what a program can compute:
#   the model judges    -> does the TASK trigger this gate?  (research, critic, qa — genuine judgement)
#   the system computes -> does the ROUTE satisfy it?        (capability present, prerequisites met)
#                       -> runtime_required                   (purely mechanical, never a judgement)
#
# SATISFACTION RULE: a gate whose capability is already supplied by the selected route is SATISFIED, not a demand for more. If critic-munger is already the
# primary owner, critic_required is met — do not add a second challenger.
#
# TAGS ARE NOT `required_personas`, AND NEITHER IS DERIVED FROM THE OTHER.
#
#   tags               = semantic characteristics of the TASK, judged by the model: security-sensitive, release-readiness, production-change, irreversible,
#                        high-consequence, thin-evidence-high-commitment. They say WHY a generic routing policy applies.
#   required_personas  = a case-specific expectation in the eval corpus. It says WHAT this particular route must contain.
#
# A task tagged `security-sensitive` activates the QA gate's escalation; a case requiring `cto-vogels` is asserting ownership of that specific case. The two
# Tags stay a MODEL judgement rather than a computed field for a measured reason: on 2026-09-01 a pattern-match over task text agreed with the corpus's own
# expectations on only 5 of 21 relevant cases — `auth` matching "authoritative", and worse. A cheap proxy would manufacture failures, so the escalation is
# corpus's ability to test task understanding separately from route correctness.
#
# Tags stay a MODEL judgement rather than a computed field for a measured reason: on 2026-09-01 a pattern-match over task text agreed with the corpus's own
# expectations on only 5 of 21 relevant cases — `auth` matching "authoritative", and worse. A cheap proxy here would manufacture failures, so the escalation is
# implemented in scripts/close_route.py and fed by whatever the model reports.

# CANONICAL PROVIDER: each judged gate also names a `default_skill` — the provider to reach for when the route has left the gate open and nothing in the task
# points at a narrower one. Without it, deterministic closure was choosing lexicographically among equally-qualified providers and reaching for
# `code-review-security` where `senior-qa` was plainly meant. `default_skill` is the canonical general-purpose provider; `default_persona` is who carries the
# capability when only a persona will do. Naming both is what lets closure prefer a skill and escalate to a persona only on the gate's own tags.
#
# HOW SATISFACTION IS RESOLVED: each gate names a `required_capability` and a `minimum_strength`. The route satisfies it when any selected skill or persona
# declares that capability at or above that strength. Gates no longer carry hand-written skill lists — those were a second copy of the taxonomy and drifted from
# the first. `minimum_strength = "primary"` on all three judged gates is deliberate: a supporting capability improves a route without discharging an obligation.
# --------------------------------------------------------------------------------------------------------------------------------------------------------------

[[gates]]
id = "research-gate"
flag = "research_required"
description = "The route depends on external facts that have not yet been gathered."
required_capability = "research"
minimum_strength = "primary"
default_skill = "deep-research"
default_persona = "research-thompson"
persona_mandatory = false
persona_mandatory_when_tags = ["contested-evidence", "regulatory", "source-validation", "market-sizing"]
set_true_when_any = [
  "the answer rests on current external facts (prices, regulation, vendor documentation, availability, market data)",
  "a decision must be grounded in evidence that has not yet been gathered",
  "source validation or triangulation is part of the work",
]
set_false_when_any = [
  "all evidence needed is already contained in the task or in the artefact under review",
  "the work is implementation against agreed criteria",
]
notes = "Means 'further external evidence must be acquired'. It does NOT stay true merely because the answer rests on facts already supplied."

[[gates]]
id = "critic-gate"
flag = "critic_required"
description = "The route reaches a consequential or hard-to-reverse conclusion."
required_capability = "independent-challenge"
minimum_strength = "primary"
default_skill = "premortem"
default_persona = "critic-munger"
persona_mandatory = false
persona_mandatory_when_tags = ["high-consequence", "irreversible", "security-sensitive", "thin-evidence-high-commitment"]
set_true_when_any = [
  "a go/no-go, commitment, or selection with material cost",
  "an architecture or design decision whose failure mode is expensive or hard to reverse",
  "the task is security-sensitive or irreversible",
  "evidence is thin or contested relative to the size of the commitment",
]
set_false_when_any = [
  "the work is gathering or summarising evidence rather than committing to it",
  "the change is small, reversible, and cheap to correct",
]
notes = "Consequence is the primary trigger; disagreement between selected personas is secondary. A structured adversarial skill (premortem, scientific-critical-thinking) discharges the obligation for ordinary consequential work; the persona is escalated to only where INDEPENDENCE of judgement is itself the deliverable, per persona_mandatory_when_tags."

[[gates]]
id = "qa-gate"
flag = "qa_required"
description = "Code, configuration, or a release is created, changed, or judged fit to ship."
required_capability = "validation"
minimum_strength = "primary"
default_skill = "senior-qa"
default_persona = "qa-bach"
persona_mandatory = false
persona_mandatory_when_tags = ["release-readiness", "go-no-go", "security-sensitive", "irreversible-rollout", "production-change"]
set_true_when_any = [
  "code or configuration will be written or modified",
  "existing code, configuration, or security posture is reviewed for defects",
  "release, rollout, or migration readiness is being judged",
  "the route must state how the change is validated or rolled back",
]
set_false_when_any = [
  "the output is analysis, research, or strategy with no artefact change",
  "the design commits to no rollout or change-validation mechanism and is not itself being approved for implementation",
]
notes = "An independent QA persona is required for release, security-sensitive and irreversible work; a validation skill suffices otherwise."

[[gates]]
id = "runtime-gate"
flag = "runtime_required"
description = "The route selects at least one skill whose execution class is `tool`."
required_capability = "tool-execution"
persona_mandatory = false
computed = true
set_true_when_any = ["any selected skill declares execution = \"tool\""]
notes = "NOT a judgement. Computed from the selected skills' `execution` field; each such skill's `requires_any` prerequisites must then be checked."

# --------------------------------------------------------------------------------------------------------------------------------------------------------------
# OWNERSHIP PRECEDENCE
#
# Two personas whose `owns` fields both plausibly cover a task is not a catalogue defect — it is the normal case for mixed work. What was missing was a
# DISCRIMINATOR, so the router was left to infer ownership from overlapping prose and picked inconsistently across near-identical tasks. Each rule below names
# the discriminating question and both answers, so the same task shape resolves the same way every time.
#
# These decide the PRIMARY OWNER only. The losing persona is normally still a consulted participant — precedence is about accountability for the decision, not
# about excluding expertise from the route.
# --------------------------------------------------------------------------------------------------------------------------------------------------------------

# Resolves the `mixed`-mode family (frontend-workflow, jdm-portal-build), where the router kept handing the decision to Full-Stack because implementation was
# the larger share of the WORK. Share of work is not the discriminator: who is accountable for the requirements is.
[[precedence]]
id = "product-vs-implementation"
applies_when = "the task both decides what to build and why, and implements how"
discriminator = "are the requirements still open?"
owner_a = "product-norman"
owner_a_when = "requirements, user workflow, scope or success criteria are still being defined"
owner_b = "fullstack-dhh"
owner_b_when = "requirements are already settled and the remaining work is implementation against them"
notes = "A `mixed` mode task that opens with 'define and build' is defining first; Product owns it. Full-Stack owns 'build this agreed spec'."

# Resolves network-code-review and its shape generally. Domain keywords in a task ("network", "BGP", "billing") pull the router toward the domain persona even
# when the deliverable is a verdict on code. Invert it: the artefact under judgement picks the owner, the domain picks the consultant.
#
# The security carve-out is not an exception bolted on — it is the same discriminator applied honestly. Security POSTURE is an architectural property, so a
# review whose deliverable is "is this safe" is CTO-owned however code-shaped the artefact is; a review whose deliverable is "is this good code", security
# included among its dimensions, is Full-Stack's. The corpus already draws this line (security-code-scan and net-security-review to CTO, network-code-review to
# Full-Stack) and an earlier draft of this rule contradicted it in two cases — which is exactly the failure precedence exists to remove, so it is stated here.
[[precedence]]
id = "artefact-vs-domain-review"
applies_when = "a review sits inside a technical domain but judges an artefact produced in another discipline"
discriminator = "what is actually being judged — the code as an artefact, or the design and posture it expresses?"
owner_a = "fullstack-dhh"
owner_a_when = "the judgement is on code quality: correctness, maintainability, defects, with security as one dimension among several"
owner_b = "cto-vogels"
owner_b_when = "the judgement is on the architecture, or on security posture as the deliverable in its own right"
notes = "Artefact responsibility outranks domain context: 'review Python network automation for defects' is a code review with network context, not a network review. But security POSTURE is architecture, not code quality — a focused secure-code review of auth and secrets handling is CTO-owned even though the artefact is code (corpus: security-code-scan, net-security-review vs network-code-review)."

# Resolves agent-routing-design. The router selected orchestrator-follett because the task's subject was orchestration — the same keyword-match reflex, applied
# reflexively to itself. Self-review is the one case where subject-matter proximity is a reason to NOT own the verdict, so it is stated as an absolute.
[[precedence]]
id = "component-cannot-architect-itself"
applies_when = "the task is architectural review or redesign of part of the agent/orchestration system"
discriminator = "is the candidate owner the component under review?"
owner_a = "cto-vogels"
owner_a_when = "always, for design or review OF the orchestration machinery"
owner_b = "orchestrator-follett"
owner_b_when = "the task is coordinating real work, not designing the coordinator"
notes = "A component does not own architectural review of itself. Orchestrator participates as subject-matter expert; it does not own the verdict on its own design."

# Resolves atar-supplier and jdm-supplier-comparison. Both personas are legitimately in the route; only the ORDER was unstable, because a supplier comparison
# reads as a money question and an evidence question at once. The deliverable settles it: evidence first means Research owns and CFO prices the shortlist.
[[precedence]]
id = "research-vs-economics"
applies_when = "supplier, vendor or option selection rests on both evidence gathering and financial comparison"
discriminator = "is the deliverable the evidence, or the financial verdict?"
owner_a = "research-thompson"
owner_a_when = "finding options, collecting and triangulating evidence, validating claims, comparing non-financial attributes"
owner_b = "cfo-campbell"
owner_b_when = "landed cost, margin, unit economics, ROI or a financially driven selection is the deliverable"
notes = "The discriminator is the QUESTION ASKED, not the vocabulary used. 'Compare suppliers on product evidence, MOQ, landed cost, lead time and supply risk' is Research-owned — it asks what the evidence shows, and financial terms appear as attributes being compared. 'Given these suppliers, which should we choose to maximise margin within our risk limits' is CFO-owned — it asks for a financial verdict. Do not route on the presence of words like 'landed cost'; an earlier keyword rule requiring cfo-campbell on exactly that match made all three models misroute atar-supplier until it was removed 2026-09-02."

# ----------------------------------------------------------------------------------------------------------------------------------------------------------
# ROUTE INVARIANTS
#
# A gate says what the route owes. Until 2026-09-01 nothing said what happens when the route does not pay: the orchestrator judged the gate, wrote it down, and
# returned a route that discharged nothing. Baseline v2 made the cost visible — all 22 gate-unsatisfied failures were that exact shape, the model reasoning
# correctly about the obligation and then finishing without meeting it, while a satisfying provider sat unselected in the catalogue.
#
# An invariant is not advice. A route that breaks one is INVALID and must be repaired before it is returned, the same way a plan that names a non-existent skill
# is invalid. Stating it as a property of the route rather than as a step in a procedure is the point: a procedure can be followed partially and still feel
# complete, whereas an invariant is either true of the finished route or it is not.
# ----------------------------------------------------------------------------------------------------------------------------------------------------------

[[route_invariants]]
id = "gate-capability-closure"
statement = "For every gate the route sets true, some selected skill or persona declares that gate's required_capability at its minimum_strength."
applies_to = "every non-computed gate whose flag the route sets true"
repair = "Add the narrowest skill declaring the capability as primary. Add the gate's default_persona only where independence is the deliverable, or where no skill provides the capability."
violation = "gate-unsatisfied"
notes = "The commonest way to break this is to satisfy the gate with a plausible neighbour — financial-unit-economics for research, deep-analysis for independent-challenge. Adjacency is not provision; check the declaration, not the vibe."

[[route_invariants]]
id = "gate-strength-closure"
statement = "A supporting capability never discharges a gate that requires primary strength."
applies_to = "every non-computed gate whose flag the route sets true"
repair = "Treat the supporting provider as not counting, and satisfy the gate as though nothing carried the capability at all."
violation = "capability-strength-insufficient"
notes = "This is the invariant that keeps `analysis != independent challenge` true. Without it, any skill that touches risk eventually reads as a critic."

[[route_invariants]]
id = "runtime-prerequisite-closure"
statement = "Every selected tool-class skill has its requires_any prerequisites checked before the route is offered."
applies_to = "every selected skill whose execution class is tool"
repair = "Confirm the prerequisite, route to an analysis-class alternative, or report the blocker. Do not offer a route that cannot run."
violation = "runtime-prerequisite-missing"
notes = "A route that cannot execute is not a cheaper route, it is a wrong answer delivered confidently."
