# ----------------------------------------------------------------------------------------------------------------------------------------------------------
# CAPABILITY REGISTRY
#
# One taxonomy, declared once. Before this existed there were two — the skills' own routing metadata, and a hand-maintained `satisfied_by_skills` list inside
# each
# gate — and nothing kept them in step. A capability is now declared on the provider that has it, and a gate names the capability it needs; the resolver joins
# them. Adding a skill therefore cannot silently fail to satisfy a gate it genuinely serves, and a gate cannot quietly drift from the skill set it describes.
#
# STRENGTH. `primary` means the capability is one of the provider's explicit operating purposes and may satisfy a gate alone. `supporting` means it is
# incidental
# — it improves route quality but does not discharge a hard obligation. The distinction exists to protect one invariant:
#
#     analysis != independent challenge
#
# A CFO modelling unit economics is doing risk-adjacent analysis; it is not an independent critic of its own conclusion. Without strength, every analytical
# skill
# drifts into `independent-challenge` and the critic gate stops meaning anything.
#
# Create a capability only when several providers can offer it, or a gate or routing rule needs to reason about it. Do not add micro-capabilities in advance of
# a
# rule that consumes them.
# ----------------------------------------------------------------------------------------------------------------------------------------------------------

# --- gate-facing: each is the required_capability of exactly one gate ---

[[capabilities]]
id = "research"
description = "Acquire external evidence not already supplied — prices, regulation, vendor documentation, availability, market data."

[[capabilities]]
id = "independent-challenge"
description = "Deliberately challenge assumptions or conclusions: search for failure modes, construct adversarial alternatives, invert the case."

[[capabilities]]
id = "validation"
description = "Verify correctness, fitness, readiness or conformance of an artefact."

[[capabilities]]
id = "tool-execution"
description = "Requires an executable runtime or tool environment. Declared by every skill whose execution class is `tool`, and by no other."

# --- supporting: routing and ranking only; no gate requires them today ---

[[capabilities]]
id = "architecture-analysis"
description = "Technical architecture, system boundaries and their trade-offs."

[[capabilities]]
id = "implementation"
description = "Build or modify code, configuration or artefacts."

[[capabilities]]
id = "code-quality-review"
description = "Correctness and maintainability review of code as an artefact."

[[capabilities]]
id = "security-review"
description = "Security posture, threats and controls."

[[capabilities]]
id = "risk-analysis"
description = "Identify operational, business or technical risk. Not the same as challenging a conclusion — see independent-challenge."

[[capabilities]]
id = "financial-analysis"
description = "Unit economics, margin, ROI, landed cost."

[[capabilities]]
id = "market-analysis"
description = "Market size, demand, competition."

[[capabilities]]
id = "regulatory-analysis"
description = "Law, compliance, import rules, policy."

[[capabilities]]
id = "operations-design"
description = "Workflows, sourcing, logistics, operating process."

[[capabilities]]
id = "product-definition"
description = "Requirements, user workflow, scope."

[[capabilities]]
id = "commercial-strategy"
description = "Pricing, channel, positioning, business model."

[[capabilities]]
id = "evidence-critique"
