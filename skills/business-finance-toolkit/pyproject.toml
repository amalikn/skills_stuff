[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "business-finance-toolkit"
version = "0.1.0"
description = "Evidence-governed commercial assessment tools and portable business-advisory skills."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Business & Finance Toolkit contributors"}]
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
analysis = ["pandas>=2.2", "duckdb>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
bftoolkit = "bftoolkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bftoolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
