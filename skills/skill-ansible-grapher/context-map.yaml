skill: skill-ansible-grapher
version: 0.2.0
authoritative_source: SKILL.md

files:
  SKILL.md:
    role: authoritative-behavioral-contract
    depends_on: []
  AGENTS.md:
    role: agent-operating-rules
    depends_on: [SKILL.md]
  README.md:
    role: user-facing-documentation
    depends_on: [SKILL.md]
  AI_NAVIGATION.md:
    role: file-authority-map
    depends_on: [SKILL.md]
  ARCHITECTURE.md:
    role: reference-architecture
    depends_on: [SKILL.md]
  config/default.yaml:
    role: runtime-defaults
    depends_on: [SKILL.md]
    note: "Safety invariants in SKILL.md override any conflicting default here."
  config/profiles.yaml:
    role: profile-definitions
    consumed_by: [scripts/ansible-grapher]
  scripts/ansible-grapher:
    role: primary-implementation
    consumed_by:
      - scripts/discover-ansible-project
      - scripts/graph-inventory
      - scripts/graph-playbook
      - scripts/graph-project
      - scripts/validate-ansible-grapher
      - scripts/clean-generated-graphs
      - justfile
    depends_on: [config/default.yaml, config/profiles.yaml]
    runtime: /Volumes/Data/_ai/_skills/skills-working-cache/skill-ansible-grapher/.venv
    provides: [toolchain-provenance, version-alignment-verdict, structural-artifact-validation]
  scripts/_resolve_python.sh:
    role: python-runtime-selector
    note: "Sourced by every shim + justfile. Managed venv by default; fails clearly (exit 5) if missing; falls back to system python3 only on explicit opt-in, always logged."
    consumed_by:
      - scripts/discover-ansible-project
      - scripts/graph-inventory
      - scripts/graph-playbook
      - scripts/graph-project
      - scripts/validate-ansible-grapher
      - scripts/clean-generated-graphs
      - justfile
  justfile:
    role: convenience-wrapper
    depends_on: [scripts/ansible-grapher, scripts/_resolve_python.sh]
  .github/workflows/skill-ansible-grapher-ci.yml:
    role: ci-workflow
    note: "Installs stable PyPI releases of both graphers (differs from this machine's dev-build checkout); runs all four test suites plus structural/determinism validation."
    depends_on: [scripts/ansible-grapher, tests/]
  templates/graph-index.md.tmpl:
    role: reference-shape-for-index.md
    note: "Actual index.md is generated by build_manifest()/write_index() in scripts/ansible-grapher; this template documents the canonical shape for anyone customizing rendering."
  templates/graph-manifest.json.tmpl:
    role: reference-shape-for-manifest.json
  templates/combined-report.md.tmpl:
    role: reference-shape-for-project-mode-report
  examples/:
    role: safe-local-fixtures
    used_by: [justfile#example, README.md]
  tests/fixtures/:
    role: safe-local-fixtures
    used_by:
      - tests/test-skill-ansible-grapher.sh
      - tests/test-output-safety.sh
      - tests/test-toolchain-compatibility.sh
      - tests/test-partial-generation-failure.sh
  tests/fixtures/fake-tools/:
    role: fake-executables-for-failure-path-testing
    note: "Never touches the real installed graphers; substituted only via ANSIBLE_GRAPHER_*_GRAPHER_BIN env var overrides."
    used_by: [tests/test-toolchain-compatibility.sh, tests/test-partial-generation-failure.sh]
  docs/tool-capabilities.md:
    role: reference
    note: "Locally observed --version/--help output; do not assume upstream docs match this install."
  docs/output-contract.md:
    role: reference
  docs/security-and-safety.md:
    role: reference
  docs/troubleshooting.md:
    role: reference
  docs/profile-reference.md:
    role: reference
  SCRATCHPAD.md:
    role: non-authoritative-dev-notes
  CHANGELOG.md:
    role: version-history

external_dependencies:
  ansible-inventory-grapher:
    kind: not-installed-by-this-skill
    resolved_via: "ANSIBLE_GRAPHER_INVENTORY_GRAPHER_BIN env var, or PATH"
    local_launcher: /Volumes/Data/_ai/_tools/tools_stuff/ansible-inventory-grapher/scripts/ansible-inventory-grapher.sh
  ansible-playbook-grapher:
    kind: not-installed-by-this-skill
    resolved_via: "ANSIBLE_GRAPHER_PLAYBOOK_GRAPHER_BIN env var, or PATH"
    local_launcher: /Volumes/Data/_ai/_tools/tools_stuff/ansible-playbook-grapher/scripts/ansible-playbook-grapher.sh
  ansible-core:
    kind: system-provided
    resolved_via: PATH (ansible-inventory, ansible-playbook)
  graphviz:
    kind: system-provided
    resolved_via: "PATH (dot)"
  python_env:
    kind: working-cache-venv
    path: /Volumes/Data/_ai/_skills/skills-working-cache/skill-ansible-grapher/.venv
    pinned_version: "3.14"
    packages: [PyYAML]
