$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ari:variable_precedence_rules.schema"
title: Variable precedence classes and conflict policy
type: object
required: [version, classes, conflict_policy]
additionalProperties: false
properties:
  version: { type: string }
  classes:
    type: array
    minItems: 1
    items:
      type: object
      required: [name, rank]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        rank: { type: integer }
  conflict_policy:
    type: object
    required: [flag_cross_class, flag_same_class_overlap, ignore_disjoint_scopes]
    additionalProperties: false
    properties:
      flag_cross_class: { type: boolean }
      flag_same_class_overlap: { type: boolean }
      ignore_disjoint_scopes: { type: boolean }
      runtime_classes:
        type: array
        items: { type: string }
