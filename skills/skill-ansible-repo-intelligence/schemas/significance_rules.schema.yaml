$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "ari:significance_rules.schema"
title: Significance classification rules
type: object
required: [version, default_significance, rules]
additionalProperties: false
properties:
  version: { type: string }
  default_significance: { enum: [critical, high, normal, low] }
  rules:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, priority, significance, match]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1 }
        priority: { type: integer }
        significance: { enum: [critical, high, normal, low] }
        reason: { type: string }
        match:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            modules:
              type: array
              items: { type: string }
            patterns:
              type: array
              items: { type: string }
