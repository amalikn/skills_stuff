# benchmark-queries.yaml — Vocus profitability DCR benchmark query set (example)
# Document: dcr-vocus-wholesale-billing.md (structured_markdown_reference)
# Usage: rag-tools benchmark-file docs/dcr-vocus-wholesale-billing.md --queries this-file.yaml
# Note: Query content is illustrative — based on DCR document structure, not real billing data.

version: 1

document_id: "dcr-vocus-wholesale-billing"
document_class: "structured_markdown_reference"

queries:
  - id: "Q1"
    query: "rebate calculation period 3"
    expected_source:
      section_id: "C2.11"
      heading_contains: "Rebate"
      table_contains: "Period 3"
    expected_terms:
      - "rebate"
      - "period"
    expected_answer_contains:
      - "period 3"
    retrieval_modes:
      - structured
      - table
    notes: "Tests section-ID-based clause retrieval for rebate period 3."

