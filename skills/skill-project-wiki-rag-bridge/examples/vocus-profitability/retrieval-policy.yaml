# retrieval-policy.yaml — Vocus Profitability project
# Location: /Volumes/Data/_ai/_project/project_stuff/apn/vocus-profitability/rag/retrieval-policy.yaml

version: 1

project_slug: "vocus_profitability"
project_collection: "rag__project_vocus_profitability"

allowed_wiki_domains:
  - "nbn"
  - "vocus"

allowed_wiki_collections:
  - "rag__wiki_nbn"
  - "rag__wiki_vocus"

forbidden_collections:
  - "rag__global_all_docs"
  - "rag__wiki_all"
  - "rag__all"
  - "default"
  - "documents"
  - "knowledge"
  - "main"

required_filters:
  - "project_slug"
  - "wiki_domain"

citation_rules:
  cite_sources: true
  cite_collection_name: true
  cite_source_file: true
  cite_section_path: true
  cite_heading: true

project:
  id: "apn-vocus-profitability"
  name: "Vocus Profitability"

retrieval_order:
  - step: 1
    source: "project_local_files"
    description: "Project invoices, reports, manifests, and analysis."
  - step: 2
    source: "project_collection"
    collection: "rag__project_vocus_profitability"
    filter_required: "project_slug = vocus_profitability"
  - step: 3
    source: "declared_wiki_domains"
    collections:
      - "rag__wiki_nbn"
      - "rag__wiki_vocus"
    filter_required: "wiki_domain in [nbn, vocus]"
  - step: 4
    source: "ask_user"
    condition: "No sufficient evidence found in steps 1–3."

authority_rules:
  project_specific_facts: "project_local"
  shared_reference_facts: "wiki_authoritative_markdown"
  nav_yaml: "routing_metadata_only"

hard_rules:
  - "Never query mcp, career, network_design, or any undeclared wiki domain."
  - "Never query global or mixed collections."
  - "Never mix project invoices/reports into wiki collections."
  - "Every result must cite source_file, section_path, heading, and collection."
  - "If insufficient evidence, say so — do not speculate."

status:
  lifecycle: "active"
  reviewed: false
